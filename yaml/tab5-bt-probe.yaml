esphome:
  name: tab5-bt-probe
  friendly_name: tab5-bt-probe

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: tab5-bt-probe Fallback Hotspot
    password: ""

captive_portal:
psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - voltage: 2.5V
    channel: 3
    
i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  sdio_frequency: 20MHz
  slot: 1   

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall_bt]
    refresh: 0s

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable
    
switch:
  - platform: gpio
    id: usb_5v_power
    name: USB-A Power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON  

  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON    

portall_bt:
  id: dongle
  # Bluedroid, host only, with the dongle as the controller. This is the whole
  # question the last build was meant to answer and could not: the option
  # defaults to none, so a firmware that does not ask for it says nothing at
  # all about whether the stack compiles and links for an esp32p4 -- and a
  # silent nothing is the failure this project keeps having to apologise for.
  #
  # It only calls esp_bluedroid_init() so far. esp_bluedroid_enable() is where
  # a host reaches for a controller, and what it reaches through is
  # esp_bluedroid_attach_hci_driver(), which is not written yet.
  host_stack: bluedroid

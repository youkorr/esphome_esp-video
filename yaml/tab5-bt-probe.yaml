esphome:
  name: tab5-bt-probe
  friendly_name: tab5-bt-probe

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: tab5-bt-probe Fallback Hotspot
    password: ""

captive_portal:
psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - voltage: 2.5V
    channel: 3
    
i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  sdio_frequency: 20MHz
  slot: 1   

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall_bt]
    refresh: 0s

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable
    
button:
  # Pairing is an ACTION and never a loop, and the reason is measured rather
  # than cautious: an inquiry sweeps the whole 2.4 GHz band at full power, and
  # on this board it took the Wi-Fi down for exactly as long as it ran, twice,
  # on two different channels. Everything after the pairing reconnects BY
  # ADDRESS, which scans nothing at all -- so remembering the device and
  # keeping the picture are the same piece of work.
  - platform: template
    name: "Pair a Bluetooth device"
    on_press:
      - portall_bt.pair: dongle

  - platform: template
    name: "Forget Bluetooth devices"
    entity_category: config
    on_press:
      - portall_bt.forget: dongle

switch:
  - platform: gpio
    id: usb_5v_power
    name: USB-A Power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON  

  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON    

portall_bt:
  id: dongle
  # Bluedroid, host only, with the dongle as the controller. This is the whole
  # question the last build was meant to answer and could not: the option
  # defaults to none, so a firmware that does not ask for it says nothing at
  # all about whether the stack compiles and links for an esp32p4 -- and a
  # silent nothing is the failure this project keeps having to apologise for.
  #
  host_stack: bluedroid

  # The panel sends its sound to a Bluetooth speaker: a car receiver, a pair
  # of headphones, a garden speaker. A2DP is Bluetooth CLASSIC, which is
  # exactly what the ESP32-C6 on these panels cannot do, so this is the half
  # of the dongle that has no alternative.
  audio: true

  # A sine, played whenever nothing else has been fed in, so the whole chain
  # can be heard before anything real is plumbed into it. Turn it off once a
  # real source is connected -- it plays for ever otherwise.
  test_tone: 440

  # A gamepad, a keyboard, a mouse or a remote -- one feature, not four. They
  # are all Classic HID, they all arrive as input reports over ACL, and they
  # differ only in which buttons somebody presses.
  #
  # Off here because the panel this was written against has no such device to
  # try it with, and a profile nobody can test is flash for nothing. Turn it
  # on and the same pair button finds one: the class of device is what sorts
  # a speaker from a gamepad, so one scan serves both.
  hid: false

  # What this panel calls itself while pairing, seen once on the screen of
  # whatever is being paired with.
  device_name: "Panel"

  # Print every input report. A HID report descriptor differs per device, so
  # these bytes are the only specification a button mapping can be written
  # against -- and there is no way to guess them. Turn it off once the mapping
  # is written: a thumbstick in motion sends a hundred of these a second.
  show_reports: false

  # The speaker's own buttons, over AVRCP. A car receiver's steering wheel, a
  # headphone's play/pause, a volume knob -- these arrive here because the
  # panel registers as the AVRCP TARGET, which is the end that RECEIVES the
  # commands. Without it the device asks for the channel and is refused, which
  # a panel's log showed as "rcvd conn req for unknown PSM: 23".
  on_media_key:
    - lambda: |-
        // code is an esp_avrc_pt_cmd_t: 0x44 play, 0x46 pause, 0x4B next,
        // 0x4C previous. The component already names the common ones in its
        // own log line; this is where a panel decides what to DO with one.
        ESP_LOGI("panel", "button %02x %s", code, pressed ? "down" : "up");

  on_media_volume:
    - lambda: |-
        // A fraction, because AVRCP carries 0..127 and nobody wants that.
        ESP_LOGI("panel", "the speaker asked for %.0f%%", volume * 100.0f);

  on_hid_report:
    - lambda: |-
        // `data` is exactly what the device sent. Where a device uses report
        // ids at all, data[0] is the id; where it does not, there is no id to
        // be had -- ESP_HIDH_DATA_IND_EVT does not carry one.
        ESP_LOGD("panel", "%u bytes from the input device", (unsigned) data.size());

# A Guition JC8012P4A1 (800x1280) as a portall panel WITH a voice assistant:
# a wake word on the board, Home Assistant's Assist, and the answer spoken on
# the panel's own speaker. It is GUITION_ PORTAL.yaml with its audio rebuilt;
# everything outside the "Audio" and "Voice" sections is that file's.
#
# Why the audio had to be rebuilt, because this is what stops a voice
# assistant on this board and it says nothing about it: the microphone and
# the speaker share one pair of clock pins (GPIO10 and GPIO12), and ESPHome
# cannot run one I2S bus both ways at once -- each of them locks the bus while
# it runs (i2s_audio's try_lock(), read in 2026.8.2), and a speaker with
# `timeout: never` never gives it back. So the microphone never got the bus,
# the wake word heard nothing, and nothing said why. ESPHome's own issue
# #16043 is this, on an ESP32-P4; full duplex is an open pull request (#16882)
# and not in any release.
#
# The way that works on stock components is TWO buses over the same pins: the
# microphone's bus is the I2S master and drives the clock all the time, and
# the speaker's bus is a secondary that plays on that clock. The one thing
# that follows from it: the microphone must always be running, or the speaker
# has no clock to play on -- which is why the wake word starts at boot and is
# never stopped, and the whole panel's sound runs at 16 kHz, the rate the
# voice assistant needs from the microphone.
substitutions:
  name: guition-portall
  friendly_name: Guition Portall


esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # After everything is set up. The microphone is the clock the speaker
    # plays on, so it starts now, whether or not Home Assistant is there yet.
    priority: -100
    then:
      - micro_wake_word.start:

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes


   
      
logger:


debug:  

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: Guition Fallback
    password: !secret fallback_password

captive_portal:
  
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17 
  use_psram: false

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  speed: 200MHz
    
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall]
    refresh: 0s 
    
  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]


  - source: github://jtenniswood/esphome-media-player@main
    components: [ gsl3680 ]
    refresh: 0s

#############################################################

#############################################################
i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

# -------------------------------------------
# Audio
# -------------------------------------------
i2s_audio:
  # The microphone's bus: the I2S master. It drives MCLK, BCLK and LRCLK for
  # as long as the microphone runs, which is always.
  - id: i2s_mic_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin:
      number: GPIO10
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO12
      allow_other_uses: true
  # The speaker's bus, on the same two clock pins: a secondary that plays on
  # the microphone's clock and never asks for the bus the microphone holds.
  - id: i2s_speaker_bus
    i2s_lrclk_pin:
      number: GPIO10
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO12
      allow_other_uses: true

# The ES8311 carries both halves: its DAC drives the speaker and its ADC reads
# the analog microphone. Its sample rate is the bus's, 16 kHz.
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    # 16-bit, not the 32-bit i2s_audio would pick: as the master, the
    # microphone sets how wide each frame is, and the DAC is 16-bit -- a
    # 32-bit frame doubles the bit clock it expects and the speaker plays
    # noise.
    bits_per_sample: 16bit
    # Which half of the frame the ES8311 puts its microphone in is the one
    # thing here nobody has measured on this board. If the voice assistant
    # hears nothing -- Assist times out with no speech -- this is the line to
    # change: `channel: left`.
    channel: right

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: i2s_speaker_bus
    i2s_mode: secondary
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_dac
    timeout: never
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 16000

  # The panel's three sounds: an answer or an announcement, a media player,
  # and the page portall renders. A mixer so one never cuts another off, and
  # `timeout: never` on each because a source that stops restarts the whole
  # output when it comes back.
  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      - id: portall_media_mixing_input
        timeout: never

  # The page's sound arrives at 48 kHz and every source of a mixer must be at
  # one rate, so it is brought down to the bus's 16 kHz here. bits_per_sample
  # is spelled out: its default is the word "passthrough", which the mixer
  # above would inherit and then refuse.
  - platform: resampler
    id: portall_resampling_speaker
    output_speaker: portall_media_mixing_input
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    task_stack_in_psram: true
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    # Asked for at the bus's own rate, so Home Assistant sends it that way
    # and nothing on the panel has to resample it.
    announcement_pipeline:
      speaker: announcement_mixing_input
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    media_pipeline:
      speaker: media_mixing_input
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    on_announcement:
      - switch.turn_on: audio_amplifier
    on_play:
      - switch.turn_on: audio_amplifier
    on_idle:
      - switch.turn_off: audio_amplifier

# -------------------------------------------
# Voice
# -------------------------------------------
# "Okay Nabu", heard on the panel itself. Never stopped, not even while the
# voice assistant is listening: the microphone it keeps running is the clock
# the answer is played on.
micro_wake_word:
  id: mww
  microphone: esp32_microphone
  stop_after_detection: false
  models:
    - model: okay_nabu
  on_wake_word_detected:
    # Said again while it is already listening: stop, the way a person would
    # say "never mind".
    - if:
        condition:
          voice_assistant.is_running:
        then:
          - voice_assistant.stop:
        else:
          - voice_assistant.start:

voice_assistant:
  id: va
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: mww

switch:
  - platform: gpio
    pin: GPIO20 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF   
    
binary_sensor:
  - platform: template
    name: "En charge"
    lambda: |-
      if (id(battery_voltage).state > 2.45) {
        return true;
      } else {
        return false;
      }

sensor:
  - platform: adc
    pin: GPIO52
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    update_interval: 300s
    attenuation: 12db # Scales the ESP32 ADC range to read up to ~3.6V safely
    filters:
      - multiply: 1.73 # Example multiplier to scale the divided voltage back to 
        
  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - calibrate_linear:
          - 3.2 -> 0.0
          - 4.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
          
  - platform: debug
    cpu_frequency:
      name: CPU Frequency  

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s
    unit_of_measurement: "dBm"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 30s

  - platform: template
    name: "SRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 300s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      return (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / 1024.0;

  - platform: template
    name: "PSRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 300s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0)
        return 0.0;
      return (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / (1024.0 * 1024.0);
      

            
number:
  - platform: template
    name: "Volume Portall"
    id: volume_portall
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 36
    on_value:
      then:
        - portall.set_volume:
            volume: !lambda 'return x / 100.0;'

    
  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 300
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout

script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            - light.turn_off: backlight    

globals:
  - id: screen_off_delay
    type: int
    restore_value: no
    initial_value: '0'


output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      - light.turn_on: backlight
      - script.execute: screen_timeout     
    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false

portall:
  display_id: main_screen
  touchscreen_id: my_touch
  id: udisp
  port: 5000
  width: 800
  height: 1280
  max_fps: 60
  jpeg_quality: 9
  rotation: 0
  max_frame_bytes: 300000
  sender_drive: false
  vendor_id: 0x303A
  product_id: 0x2986
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"
  speaker_id: portall_resampling_speaker
  on_audio_start:
    - switch.turn_on: audio_amplifier

 
    

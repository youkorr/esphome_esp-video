#############################################################

#############################################################
i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

# -------------------------------------------
# Audio
# ------------------------------------------- 
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

# DAC pour la sortie haut-parleur
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    use_mclk: true

# ADC pour le microphone
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: 0x36


# Lit les données I2S venant du micro (GPIO11)
microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    
speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    

media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    #codec_support_enabled: true
    # buffer_size: 2000000
    task_stack_in_psram: true
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_play:
      - logger.log: "Media player started playing, disabling microphone"
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start

micro_wake_word:
  id: my_wake_word
  models:
    - okay_nabu
  on_wake_word_detected:
    then:
      #- lvgl.page.show: listening_page 
      - light.turn_on: backlight
      - logger.log: "Wake word detected"
      - voice_assistant.start:
          wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s
  on_end:
    # Wait a short amount of time to see if an announcement starts
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    # Announcement is finished and the I2S bus is free
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
        



    
switch:
  - platform: gpio
    pin: GPIO20 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF   
    
binary_sensor:
  - platform: template
    name: "Batterie"
    device_class: battery
    lambda: |-
      if (isnan(id(battery_voltage).state)) {
        return {};
      }
      return id(battery_voltage).state <= 2.54;

sensor:
  - platform: adc
    name: "Battery voltage"
    id: battery_voltage  # <-- Identifiant obligatoire requis par le binary_sensor
    pin: GPIO52
    update_interval: 30s
    attenuation: 12dB
    samples: 10
    
  - platform: debug
    cpu_frequency:
      name: CPU Frequency  

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s
    unit_of_measurement: "dBm"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 30s

  # Ces deux-la sont la raison d'etre du fichier autant que l'image : la
  # fenetre TCP consomme de la RAM interne, le tampon du PPA de la PSRAM.
  # Le total vient de l'allocateur et n'est pas ecrit en dur -- le P4 a 768 Ko
  # de L2MEM, pas les 512 d'un ESP32-S3.
  - platform: template
    name: "SRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      return (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / 1024.0;

  - platform: template
    name: "PSRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0)
        return 0.0;
      return (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / (1024.0 * 1024.0);

    
number:
  - platform: usb_display
    name: "Volume écran"

  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 0
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout

script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            - light.turn_off: backlight
    

globals:
  - id: screen_off_delay
    type: int
    restore_value: no
    initial_value: '0'


output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      - light.turn_on: backlight
      - script.execute: screen_timeout

        
      
    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false
    #rotation: 0

usb_display:
  display_id: main_screen
  touchscreen_id: my_touch
  port: 5000
  # La dalle, et ce que le tactile rapporte.
  width: 800
  height: 1280

  #render_width: 640
  #render_height: 1024
  rotation: 0
  max_frame_bytes: 300000
  sender_drive: false
  vendor_id: 0x303A
  product_id: 0x2986
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"
  speaker_id: esp32_speaker
  on_audio_start:
    - switch.turn_on: audio_amplifier
    - micro_wake_word.stop
  on_audio_stop:
    - micro_wake_word.start
    - switch.turn_off: audio_amplifier  
    
# =============================================================================
# LE VISAGE KAWAII
# =============================================================================
# parent_id accepte l'id d'un widget (ici face_panel) ou directement l'id d'une
# page. Le visage est créé DANS ce widget — plus jamais sur la page affichée au
# démarrage.
lvgl_kawaii_face:
  id: face
  parent_id: face_panel
  initial_emotion: worried
  animation_speed: 30ms
  blink_interval: 3000ms
  auto_blink: true
  smooth: true
  response_fallback: speaking
  response_keywords:          # optional; overrides the built‑in FR/EN defaults
    happy: ["bravo", "super", "done", "great"]
    sad:   ["désolé", "error", "sorry"]
  # Optionnel : la couleur est déduite du fond de la page si on l'omet.
  # bg_color: ${background_color}

# =============================================================================
# VIE AUTONOME — le visage vit même quand on ne lui parle pas
# =============================================================================
# Tempérament « expressif » : une expression toutes les ~10 s sur toute la
# palette. Tout est mis en veille dès qu'une conversation démarre (va_busy),
# pour ne jamais écraser la réaction à l'assistant vocal.
#
# Pour calmer le visage : allonge l'interval, ou réduis la liste IDLE_SET.
# =============================================================================
# RYTHME DE LA JOURNÉE
# =============================================================================



interval:

  - interval: 66ms
    then:
      - lambda: id(tab5_cam).capture_frame();  
  # Bandeau de diagnostic du suivi caméra (5 Hz), seulement quand demandé.
  - interval: 200ms
    then:
      - if:
          condition:
            switch.is_on: cam_debug_switch
          then:
            - lvgl.widget.show:
                id: cam_debug
            - lvgl.label.update:
                id: cam_debug
                text: !lambda |-
                  uint32_t last = id(last_face_seen);
                  if (last == 0) {
                    return esphome::str_sprintf("Faces:%d  Look:%d,%d  Vu: Jamais",
                                                id(dbg_faces), id(dbg_gx), id(dbg_gy));
                  }
                  uint32_t age = millis() - last;
                  return esphome::str_sprintf("Faces:%d  Look:%d,%d  Vu il y a %ums",
                                              id(dbg_faces), id(dbg_gx), id(dbg_gy), (unsigned) age);
          else:
            - lvgl.widget.hide:
                id: cam_debug



  # ---------------------------------------------------------------------
  # SUIVI DU REGARD : les yeux se posent sur la personne vue par la caméra.
  # 10 Hz — assez fluide pour paraître vivant, assez lent pour ne rien coûter.
  # La détection tourne à son propre rythme (detection_interval) de son côté.
  # ---------------------------------------------------------------------
  - interval: 30ms
    then:
      - lambda: |-
          static const char *const TAG = "kawaii.follow";
          static bool had_face = false;
          static uint32_t last_log = 0;

          // Journalisation détaillée
          const bool dbg = id(cam_debug_switch).state;
          const bool log_now = dbg && (millis() - last_log > 500);

          int iw = id(tab5_cam).get_image_width();
          int ih = id(tab5_cam).get_image_height();

          // 1. VÉRIFICATION CAMÉRA EN PREMIER
          if (iw <= 0 || ih <= 0) {
            if (had_face) {
              ESP_LOGW(TAG, "LOST face (Camera timeout / image 0x0)");
              had_face = false;
            }
            if (log_now) {
              last_log = millis();
              ESP_LOGW(TAG, "CAMERA MUETTE (dimensions %dx%d)", iw, ih);
            }
            id(dbg_faces) = 0;
            return;
          }

          // 2. VÉRIFICATION DES VISAGES
          auto faces = id(face_detect).get_detected_faces();
          if (faces.empty()) {
            if (had_face) {
              ESP_LOGI(TAG, "LOST face");
              had_face = false;
            }
            if (log_now) {
              last_log = millis();
              ESP_LOGI(TAG, "0 visage | image %dx%d", iw, ih);
            }
            id(dbg_faces) = 0;
            return;
          }

          // 3. SÉLECTION DU VISAGE LE PLUS GRAND
          const auto *best = &faces[0];
          int best_area = 0;
          for (auto &f : faces) {
            int area = (f.x2 - f.x1) * (f.y2 - f.y1);
            if (area > best_area) { best_area = area; best = &f; }
          }

          // 4. CALCUL DU SUIVI & MULTIPLICATEURS
          int cx = (best->x1 + best->x2) / 2;
          int cy = (best->y1 + best->y2) / 2;
          
          int gx = (cx * 200) / iw - 100;      // -100..100
          int gy = (cy * 200) / ih - 100;

          float sensibilite_x = 2.0; 
          float sensibilite_y = 1.5; 
          
          gx = gx * sensibilite_x;
          gy = gy * sensibilite_y;

          // Bornage -100..100
          if (gx < -100) gx = -100;
          if (gx > 100) gx = 100;
          if (gy < -100) gy = -100;
          if (gy > 100) gy = 100;

          // Inversion X pour l'effet miroir (Gauche/Droite)
          gx = -gx;
          
          // Inversion Y (Haut/Bas) : Décommente la ligne ci-dessous si le visage regarde à l'envers verticalement
          // gy = -gy;

          // Lissage très réactif à 30ms
          static int sx = 0, sy = 0;
          sx = (sx * 2 + gx) / 3;
          sy = (sy * 2 + gy) / 3;

          if (!had_face) {
            ESP_LOGI(TAG, "face ACQUIRED (score %.2f)", best->score);
            had_face = true;
          }
          if (log_now) {
            last_log = millis();
            ESP_LOGI(TAG,
                     "%d visage(s) | boite (%d,%d)-(%d,%d) score %.2f | image %dx%d"
                     " | centre (%d,%d) -> brut (%d,%d) -> lisse (%d,%d)",
                     (int) faces.size(), best->x1, best->y1, best->x2, best->y2,
                     best->score, iw, ih, cx, cy, gx, gy, sx, sy); 
          }

          id(last_face_seen) = millis();
          id(last_interaction) = millis();
          
          // === L'axe Y est maintenant libéré (sy au lieu de sy / 2) ===
          id(face).look_at(sx, sy, 1500);

          id(dbg_faces) = faces.size();
          id(dbg_gx) = sx;
          id(dbg_gy) = sy; // === Modifié ici aussi pour le debug ===

  # Plus personne depuis 10 s -> le visage se désintéresse.
  - interval: 2s
    then:
      - if:
          condition:
            - lambda: 'return id(last_face_seen) != 0 && (millis() - id(last_face_seen)) > 10000;'
          then:
            - lambda: id(last_face_seen) = 0;

  # Regard vagabond : les yeux balaient la pièce entre deux expressions.
  # Se tait dès qu'un visage est suivi par la caméra, sinon il tirerait les
  # yeux au hasard toutes les 2,5 s en pleine poursuite.
  - interval: 30s
    then:
      - lambda: |-
          size_t free_int = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          ESP_LOGI("mem", "Internal free: %u KB | PSRAM free: %u KB",
                   (unsigned)(free_int / 1024),
                   (unsigned)(free_psram / 1024));

  - interval: 60s
    then:
      - lambda: |-
          // Log real memory usage (ESP32-P4: 768KB SRAM, 32MB PSRAM)
          const size_t total_sram = 768 * 1024;        // Changer ici: 512 → 768 KB
          const size_t total_psram = 32 * 1024 * 1024; // Changer ici: 8 → 32 MB
          
          size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t used_sram = total_sram - free_sram;
          
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          size_t used_psram = total_psram - free_psram;
          
          ESP_LOGI("system_info", "SRAM: %u/%u KB used (%.1f%%)", 
                   (unsigned)(used_sram/1024), (unsigned)(total_sram/1024), 
                   (used_sram * 100.0) / total_sram);
          
          if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) > 0) {
            ESP_LOGI("system_info", "PSRAM: %u/%u MB used (%.1f%%)", 
                     (unsigned)(used_psram/(1024*1024)), (unsigned)(total_psram/(1024*1024)),
                     (used_psram * 100.0) / total_psram);
          } else {
            ESP_LOGI("system_info", "PSRAM: Not available");
          }


  - interval: 2500ms
    then:
      - if:
          condition:
            switch.is_on: face_demo
          then:
            - lambda: |-
                // Même ordre que ALL_EMOTIONS[] dans examples/basic_cycle/main/main.c
                static const char *const EMOTIONS[] = {
                    "neutral", "happy", "worried", "wink", "love", "surprised",
                    "playful", "silly", "smirk", "working_hard", "excited",
                    "confused", "cool", "sleepy", "sad", "cry", "angry"};
                const int count = sizeof(EMOTIONS) / sizeof(EMOTIONS[0]);
                int i = id(demo_emotion_idx);
                id(demo_emotion_name) = EMOTIONS[i];
                id(demo_emotion_idx) = (i + 1) % count;
            - lvgl_kawaii_face.set_emotion:
                id: face
                emotion: !lambda return id(demo_emotion_name);
            - lvgl.label.update:
                id: face_caption
                text: !lambda return id(demo_emotion_name);          
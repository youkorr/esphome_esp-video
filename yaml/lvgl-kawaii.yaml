    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s



  - platform: internal_temperature
    name: "ESP32p4 Internal Temperature"
    id: esp32_temperature
    update_interval: 60s


  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    unit_of_measurement: "dBm"

text_sensor:


  - platform: template
    name: "Camera Status Info"
    id: camera_status_info
    internal: true
    update_interval: never  # Désactivé par défaut
    lambda: |-
      static char buf[100];
      snprintf(buf, sizeof(buf), "%dx%d | %s | Buffer: %d KB",
        id(tab5_cam).get_image_width(),
        id(tab5_cam).get_image_height(),
        id(tab5_cam).is_streaming() ? "STREAMING" : "IDLE",
        id(tab5_cam).get_image_size() / 1024);
      return {buf};

    
switch:


  #- platform: face_detection
    #name: "Détection de visage"
    #id: face_detect_switch 
    #face_detection_id: face_detect
    #restore_mode: RESTORE_DEFAULT_ON

  - platform: gpio
    pin: GPIO53
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF

  # Fait défiler les 17 expressions, comme examples/basic_cycle du dépôt
  # d'origine. Sert à juger le rendu sans déclencher l'assistant vocal.
  # Coupe-le pour laisser le voice assistant piloter le visage.
  - platform: template
    name: "Debug suivi caméra"
    id: cam_debug_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_off_action:
      - lvgl.label.update:
          id: cam_debug
          text: ""

  - platform: template
    name: "Démo expressions du visage"
    id: face_demo
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_off_action:
      - lvgl.label.update:
          id: face_caption
          text: ""
  - platform: template
    name: "LVGL Camera Display"
    id: lvgl_display_enable_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);  
          if (lvgl_disp != nullptr) {
            lvgl_disp->set_enabled(true);
          }
    turn_off_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);  
          if (lvgl_disp != nullptr) {
            lvgl_disp->set_enabled(false);
          }

# =============================================================================
# CAMÉRA + DÉTECTION DE VISAGE — le regard suit la personne
# =============================================================================
esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: false

esp_cam_sensor:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  resolution: "1280x960"          #"1920x1080"  #"800x800"   #"1280x960"    #"800x640"    
  framerate: 30
  pixel_format: RGB565
  #jpeg_quality: 15
  mirror_x: false
  mirror_y: false
  rotation: 0
  crop_offset_x: 0

face_detection:
  id: face_detect
  camera_id: tab5_cam
  canvas_id: camera_canvas
  model_type: face_recognition
  score_threshold: 0.3
  nms_threshold: 0.4
  detection_interval: 4
  draw_enabled: false
  recognition_enabled: false
  face_db_path: "/sdcard/reconnaisance_faciale/faces.db"
  recognition_threshold: 1
  
image:
  - platform: online_image
    url: "${frigate}"
    format: jpeg
    type: RGB565
    id: cctv_img
    
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 8ms   # polling (pas d'interruption)
    on_touch:
      - lambda: |-
          ESP_LOGD("touchscreen", "Touch detected at (%d, %d)", touch.x, touch.y);
      - light.turn_on: backlight 
               
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true   
    
display:
  - platform: mipi_dsi
    id: main_display
    show_test_card: false
    model: CUSTOM
    update_interval: never
    auto_clear_enabled: false
    hsync_back_porch: 160
    lane_bit_rate: 1000Mbps
    color_order: rgb
    lanes: 2
    reset_pin:
      number: 33
    hsync_pulse_width: 70
    hsync_front_porch: 160
    vsync_back_porch: 23
    vsync_pulse_width: 1
    vsync_front_porch: 12
    pclk_frequency: 51MHz 
    dimensions:
      width: 1024
      height: 600     
    init_sequence:   
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11, 0x00]
      - delay 120ms
      - [0x29]


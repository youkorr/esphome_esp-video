esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  use_psram: true
  slot: 1

i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz 

esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4  
    
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
# =============================================================================
# I2S AUDIO CONFIGURATION (ES7210 + ES8311)
# =============================================================================
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 500ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16



media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_play:
      - logger.log: "Media player started playing, disabling microphone"
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start



micro_wake_word:
  id: mww
  models:
    - okay_nabu
#    - hey_mycroft
#    - hey_jarvis
  on_wake_word_detected:
    - component.update: main_display
    # Le mot d'éveil amène le visage à l'écran et le réveille.
    - lvgl.page.show:
        id: page_face
        animation: MOVE_LEFT
        time: 250ms
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: excited
    - lambda: id(va_busy) = true;
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_start:
    - component.update: main_display

  on_listening:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: listening

  on_stt_end:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: thinking

  # `x` = le texte prononcé : le visage suit le CONTENU de la réponse,
  # et la bouche s'anime tant qu'il parle.
  on_tts_start:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion_from_text:
        id: face
        text: !lambda return x;
    - lvgl_kawaii_face.set_talking: true

  on_tts_end:
    - component.update: main_display
    - lvgl_kawaii_face.set_talking: false


  # --- End of flow → idle ---
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: neutral
    - lvgl_kawaii_face.set_talking: false
    - lambda: |-
        id(va_busy) = false;
        id(last_interaction) = millis();

    - micro_wake_word.start:

  on_error:
    - component.update: main_display
    - lvgl_kawaii_face.set_talking: false
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: error
    - lambda: id(va_busy) = false;


  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

globals:
  # Index courant dans la liste des 17 expressions (démo).
  - id: demo_emotion_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: demo_emotion_name
    type: std::string
    restore_value: false
  # Vrai pendant toute une conversation : la vie autonome se tait alors.
  - id: va_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  # Horodatage de la dernière sollicitation, pour l'endormissement.
  - id: last_interaction
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: idle_emotion
    type: std::string
    restore_value: false

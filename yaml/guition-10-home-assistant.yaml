# ============================================================================
#  Guition 10" (JC8012P4A1, 800x1280 portrait) -- ecran Home Assistant sans fil
#
#  Ce fichier decrit UNIQUEMENT le firmware de la carte.
#  Le tableau de bord, le jeton et l'adresse du serveur se reglent ailleurs :
#  Home Assistant -> Modules complementaires -> ESP32-P4 Panel -> Configuration.
#  Aucun "token:", "url:" ni "panels:" ne doit apparaitre ici.
#
#  Cette dalle est aussi un assistant vocal : micro, haut-parleur, mot d'eveil.
#  Les deux fonctions partagent la carte sans se gener -- l'image arrive par le
#  reseau, le son reste entierement du cote ESPHome.
# ============================================================================

substitutions:
  name: guition-10-home-assistant
  # Le capteur de presence qui rallume la dalle AVANT qu'un doigt arrive.
  # N'importe quelle entite binaire de Home Assistant : un mmWave, un
  # detecteur de mouvement, une camera qui detecte une personne.
  #
  # L'interet n'est pas le confort mais le cout. Sans presence, la dalle ne se
  # rallume qu'au toucher, donc l'emetteur doit garder la page vivante pour que
  # le reveil soit instantane. Avec, le rechargement se fait pendant que vous
  # traversez la piece, et l'add-on peut lacher la page pour de bon
  # (blank_after) sans que personne ne voie jamais l'attente.
  #
  # Si l'entite n'existe pas, rien ne casse : le capteur reste a l'arret, les
  # declencheurs ne partent jamais, et la dalle se comporte comme avant.
  presence_entity: binary_sensor.presence_salon

esphome:
  name: ${name}
  friendly_name: ${name}
  # micro_wake_word tire esp-tflite-micro, dont la compilation a deja fait
  # tuer cc1plus par le noyau faute de memoire. Un seul processus a la fois
  # est plus lent et passe.
  compile_process_limit: 1

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  speed: 200MHz

logger:

debug:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # Pas ${name} : le nom de l'appareil suivi de " Fallback Hotspot" depasse
    # les 32 caracteres qu'un SSID autorise, et esphome refuse la configuration.
    ssid: Guition Fallback
    password: !secret ap_password

captive_portal:

# Le P4 n'a pas de radio : le Wi-Fi passe par un C6 en co-processeur.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  use_psram: true

esp_ldo:
  - channel: 3
    voltage: 2.5V

http_request:

update:
  - platform: esp32_hosted
    id: c6_firmware_update
    name: "ESP32-C6 Firmware"
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall]
    refresh: 0s
  - source: github://kvj/esphome@jd9365_gsl3680
    components: [jd9365]
    refresh: 0s
  - source: github://jtenniswood/esphome-media-player@main
    components: [gsl3680]
    refresh: 0s

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

# ---------------------------------------------------------------------------
#  Son
# ---------------------------------------------------------------------------

audio_dac:
  - platform: es8311
    id: es8311_codec
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 44100
    use_mclk: true
    use_microphone: true
    mic_gain: 24DB

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: external_mic
    i2s_audio_id: i2s_output
    i2s_mode: primary
    adc_type: external
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    id: speaker_id
    i2s_dout_pin: GPIO09
    dac_type: external
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_codec
    buffer_duration: 1000ms
    i2s_mode: primary
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input
      # Le son de la page, troisieme entree du melangeur. Une entree a lui et
      # non celle du lecteur multimedia : ainsi une annonce de Home Assistant
      # passe PAR-DESSUS la video au lieu de se battre avec elle pour le bus
      # I2S, et couper l'une ne coupe pas l'autre.
      - id: portall_spk_mixer_input
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
  # portall envoie du 48 kHz -- c'est ce que produit un navigateur -- et cette
  # dalle sort du 44,1 kHz. Sans ce rechantillonneur le melangeur refuse le
  # flux ("Incompatible audio streams") et ce qui sort est du bruit.
  - platform: resampler
    id: portall_spk_resampling_input
    output_speaker: portall_spk_mixer_input
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: "Speaker Media Player"
    id: speaker_media_player_id
    task_stack_in_psram: true
    buffer_size: 1000000
    volume_initial: 70%
    volume_max: 70%
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      sample_rate: 44100
      num_channels: 1

voice_assistant:
  microphone: external_mic
  media_player: speaker_media_player_id
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

micro_wake_word:
  id: my_wake_word
  models:
    - okay_nabu
  on_wake_word_detected:
    then:
      - light.turn_on: backlight
      - logger.log: "Wake word detected"
      - voice_assistant.start:
          wake_word: !lambda return wake_word;

switch:
  - platform: gpio
    pin: GPIO20
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------------
#  Ecran et tactile
# ---------------------------------------------------------------------------

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_output
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: screen_off_delay
    type: int
    restore_value: false
    initial_value: '0'

# ---------------------------------------------------------------------------
#  Presence : rallumer avant qu'on touche, ne pas s'eteindre devant quelqu'un
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: room_presence
    entity_id: ${presence_entity}
    internal: true
    on_press:
      # Reveiller l'emetteur d'abord : il a une image entiere a refaire, et
      # s'il avait lache la page il doit la recharger. C'est ce temps-la qu'on
      # veut passer pendant que la personne traverse la piece.
      - portall.wake: udisp
      - light.turn_on: backlight
    on_release:
      # La piece se vide : un compte a rebours neuf.
      - script.execute: screen_timeout

script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            # Ne pas s'eteindre au nez de quelqu'un. Le compte a rebours ne
            # repart pas ici : c'est on_release du capteur qui en lance un neuf
            # quand la piece se vide. Sans entite de presence, le capteur est a
            # l'arret, la condition est vraie, et c'est le comportement d'avant.
            - if:
                condition:
                  binary_sensor.is_off: room_presence
                then:
                  - light.turn_off: backlight
                  # Et le dire : sans cette ligne l'emetteur continue de rendre,
                  # d'encoder et d'envoyer pour une dalle noire. C'est aussi ce
                  # qui autorise l'add-on a lacher la page.
                  - portall.sleep: udisp

touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    # ESPHome appelle listener->update() AVANT ce declencheur, donc le contact
    # part deja vers l'expediteur pendant que le retroeclairage se rallume.
    on_touch:
      # L'emetteur d'abord : il a une image entiere a renvoyer. Le toucher qui
      # reveille n'est pas transmis a la page -- la carte le retient tant
      # qu'elle dort -- donc il ne presse rien au passage.
      - portall.wake: udisp
      - light.turn_on: backlight
      - script.execute: screen_timeout

display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    # C'est portall qui pousse les pixels : ESPHome ne doit ni rafraichir
    # ni effacer cet ecran de lui-meme.
    update_interval: never
    auto_clear_enabled: false

portall:
  # Nomme, parce que portall.sleep et portall.wake ont besoin de le
  # designer.
  id: udisp
  display_id: main_screen
  touchscreen_id: my_touch
  port: 5000
  width: 800
  height: 1280
  # La dalle est nativement en portrait et sert en portrait : rien a tourner.
  # Laisser ceci a 0 veut dire qu'il ne faut PAS non plus mettre "rotate" dans
  # les options du module complementaire -- l'exemple livre avec l'add-on
  # contient rotate: 180, qui ferait tourner l'image une fois de trop.
  rotation: 0
  # 800 = douze tuiles de 64 et un reste de 32. L'expediteur elargit ce genre
  # de bande en arriere avant de l'envoyer, sinon le decodeur materiel rend
  # ESP_ERR_TIMEOUT au lieu de pixels et le bord droit ne se redessine jamais.
  max_frame_bytes: 300000
  # OU sort le son. Une seule ligne pour les deux chemins : celui du reseau
  # (le son de la page, 48 kHz 16 bits mono, par la meme socket que l'image)
  # et celui de l'USB (la carte devient une carte son pour un PC relie par
  # cable). Sans elle le panneau reste muet.
  #
  # Elle pointait avant sur speaker_id, la sortie I2S brute, ce qui mettait ce
  # son en concurrence directe avec le lecteur multimedia sur le meme bus. En
  # passant par le rechantillonneur et le melangeur, une annonce de Home
  # Assistant se pose PAR-DESSUS le son de la page au lieu de le bousculer.
  speaker_id: portall_spk_resampling_input
  sender_drive: false
  vendor_id: 0x303A
  product_id: 0x2986
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"
  # Ces deux-la ne servent qu'au chemin USB par cable et sont sans effet ici :
  # jpeg_quality ne fait que composer la chaine que lit le pilote Windows, et
  # le plafond max_fps ne s'applique pas aux images venues du reseau, qui
  # portent deja leur propre cadencement.
  jpeg_quality: 9
  max_fps: 60
  on_audio_start:
    - switch.turn_on: audio_amplifier
    - micro_wake_word.stop
  on_audio_stop:
    - micro_wake_word.start
    - switch.turn_off: audio_amplifier

number:
  - platform: portall
    name: "Volume ecran USB"
  # Cette entite SUIT le son: elle affiche le volume courant, et le change
  # quand on la bouge. C'est ce qu'il faut quand un hote USB regle son propre
  # volume de son cote -- les deux restent d'accord.
  #
  # Ce qu'elle ne fait pas, c'est etre un REGLAGE: elle ne se souvient de rien
  # au redemarrage. Pour un volume que l'on choisit une fois et qui revient au
  # boot, c'est un number template ordinaire, comme ci-dessous -- la facon
  # ESPHome de faire -- et portall.set_volume est ce qui lui donne prise sur
  # le composant. Les deux peuvent coexister: la premiere affichera ce que la
  # seconde a regle.
  - platform: template
    name: "Volume Portall"
    id: volume_portall
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 40
    on_value:
      then:
        # Une fraction, comme tous les volumes d'ESPHome, d'ou la division:
        # le curseur va jusqu'a 100 et le composant attend 0 a 1.
        - portall.set_volume:
            volume: !lambda 'return x / 100.0;'


  - platform: template
    id: brightness_slider
    name: "Luminosite Ecran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 0
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout

sensor:
  - platform: adc
    name: "Battery voltage"
    pin: GPIO52
    update_interval: 30s
    attenuation: 12dB
    samples: 10

  - platform: debug
    cpu_frequency:
      name: CPU Frequency

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: esp32_temperature
    update_interval: 30s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 30s
    unit_of_measurement: "dBm"

  - platform: template
    name: "PSRAM Usage"
    id: psram_usage
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0)
        return 0.0;
      return (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / (1024.0 * 1024.0);

  - platform: template
    name: "SRAM Usage"
    id: sram_usage
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      return (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / 1024.0;

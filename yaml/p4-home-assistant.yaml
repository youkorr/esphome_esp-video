# ============================================================================
#  Waveshare ESP32-P4-WIFI6-TOUCH-LCD-7B  --  ecran Home Assistant sans fil
#
#  Ce fichier decrit UNIQUEMENT le firmware de la carte.
#  Le tableau de bord, le jeton et l'adresse du serveur se reglent ailleurs :
#  Home Assistant -> Modules complementaires -> ESP32-P4 Panel -> Configuration.
#  Aucun "token:", "url:" ni "panels:" ne doit apparaitre ici.
# ============================================================================

substitutions:
  name: p4-home-assistant

esphome:
  name: ${name}
  friendly_name: ${name}
  on_boot:
    - script.execute: screen_timeout

esp32:
  board: esp32-p4-evboard
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

logger:
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome

# ---------------------------------------------------------------------------
#  Reseau : le Wi-Fi passe par le co-processeur ESP32-C6 de la carte
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} Fallback

captive_portal:

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  slot: 1

# ---------------------------------------------------------------------------
#  Bus partages
# ---------------------------------------------------------------------------
i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# Alimente le PHY MIPI. Sans ca, pas d'image.
esp_ldo:
  - voltage: 2.5V
    channel: 3

# ---------------------------------------------------------------------------
#  Dalle et retroeclairage
# ---------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_screen
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    pixel_mode: 16
    # usb_display dessine lui-meme, quand une image arrive.
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO32
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    name: Retroeclairage
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

# ---------------------------------------------------------------------------
#  Tactile
#
#  transform: corrige le montage de la dalle. Les contacts partent ensuite
#  vers l'emetteur, qui les rejoue dans le navigateur. La correspondance
#  exacte se mesure une fois avec "ha_send.py --calibrate", pas ici.
# ---------------------------------------------------------------------------
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 20ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    on_touch:
      # Reveille l'emetteur d'abord : il a une image entiere a renvoyer.
      # Le toucher qui reveille n'est pas transmis a la page -- la carte le
      # retient tant qu'elle dort -- donc il ne presse rien au passage.
      - usb_display.wake: udisp
      # Rallume, et relance le compte a rebours depuis zero. Le script est en
      # mode "restart", donc un toucher pendant qu'il attend annule l'attente
      # en cours et en commence une neuve.
      - light.turn_on: backlight
      - script.execute: screen_timeout

# ---------------------------------------------------------------------------
#  Son : le PC ou le serveur envoie l'audio par USB, il sort sur l'ES8311
# ---------------------------------------------------------------------------
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: stereo
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

switch:
  - platform: gpio
    id: audio_amplifier
    pin: GPIO53
    name: Amplificateur
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------------
#  L'ecran deporte lui-meme
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [usb_display]
    refresh: 0s

usb_display:
  id: udisp
  display_id: main_screen
  # Sans ca, pas de tactile renvoye a l'emetteur.
  touchscreen_id: touch
  # Sans ca, pas de son et pas de "number" plus bas.
  speaker_id: esp32_speaker
  # Le port sur lequel l'emetteur se connecte. C'est tout ce qu'il faut
  # pour le sans-fil : le cable USB ne sert plus qu'a alimenter la carte.
  port: 5000
  # Doivent correspondre a ce qui est regle dans l'add-on.
  width: 1024
  height: 600
  # La carte ne tourne pas l'image : c'est l'emetteur qui le fait (--rotate).
  rotation: 0
  max_frame_bytes: 300000
  max_fps: 60
  sender_drive: false
  vendor_id: 0x303A
  product_id: 0x2986
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"
  # L'ampli ne s'allume que quand du son arrive, et se coupe apres.
  on_audio_start:
    - switch.turn_on: audio_amplifier
  on_audio_stop:
    - switch.turn_off: audio_amplifier


# ---------------------------------------------------------------------------
#  Mise en veille de la dalle
#
#  Le retroeclairage s'eteint apres un temps sans toucher, et se rallume au
#  premier contact. Le compte a rebours est un script en mode "restart" :
#  chaque toucher le relance depuis zero, ce qui est tout ce qu'il faut.
#  0 ou moins = jamais de veille.
# ---------------------------------------------------------------------------
globals:
  - id: screen_off_delay
    type: int
    restore_value: no
    initial_value: '60'

script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            - light.turn_off: backlight
            # Et on le dit : l'emetteur arrete de rendre et d'envoyer, la
            # liaison reste ouverte. Sans cette ligne le rendu continue pour
            # une dalle noire.
            - usb_display.sleep: udisp

number:
  - platform: usb_display
    name: Volume

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 60
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      # Prise en compte immediate : le compte a rebours repart avec la
      # nouvelle valeur au lieu d'attendre le prochain toucher.
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout

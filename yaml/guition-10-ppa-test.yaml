# ============================================================================
#  Guition 10" (JC8012P4A1, 800x1280) -- ESSAI DE LA MISE A L'ECHELLE PPA
#
#  Firmware d'essai, volontairement minimal : ni audio, ni micro_wake_word,
#  ni assistant vocal. C'est deliberé -- micro_wake_word tire esp-tflite-micro,
#  dont la compilation fait tuer cc1plus faute de memoire, et rien de tout cela
#  n'a de rapport avec ce qu'on veut mesurer. La compilation est bien plus
#  rapide et le changement est isolé.
#
#  CE QUI EST TESTE : l'hote dessine en 640x1024 et l'accelerateur du P4
#  remonte a 800x1280. Mesure cote serveur, par image : 3,3 ms de travail au
#  lieu de 8,7, et 13,0 KiB au lieu de 18,0.
#
#  LES DEUX COTES DOIVENT S'ACCORDER. Dans les options du module
#  complementaire (1.18.0 ou plus), pour ce panneau :
#
#      render_width: 640
#      render_height: 1024
#
#  Ou a la main :
#
#      python ha_send.py --host <ip> --width 800 --height 1280
#          --render-width 640 --render-height 1024 --url ... --stats
#
#  Si un seul des deux cotes est regle, la carte refuse les rectangles et le
#  dit : "Ignoring frames: host sends ... which is not a JPEG rectangle inside
#  640x1024". C'est bruyant expres.
#
#  CE QU'IL FAUT REGARDER, dans le journal de la carte :
#    - au demarrage : "Host draws 640x1024, scaled up by the pixel-processing
#      accelerator"
#    - toutes les cinq secondes : "... us/draw, N dropped (... M rotate)".
#      Le PPA fait maintenant une passe par rectangle qu'il ne faisait pas :
#      si "rotate" monte, c'est la que ca se verrait.
#    - "PSRAM Usage" doit monter d'environ 1,25 Mo : le tampon de decodage
#      retrecit (640x1024 au lieu de 800x1280) mais il faut ajouter un tampon
#      de destination a la taille de la dalle pour la sortie du PPA.
#
#  ET LA SEULE CHOSE QUE LE JOURNAL NE DIRA PAS : la nettete du texte. C'est
#  a l'oeil que ca se juge. Trop mou -> retirer les deux lignes render_*.
# ============================================================================

substitutions:
  name: guition-10-ppa-test

esphome:
  name: ${name}
  friendly_name: ${name}

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  speed: 200MHz

# Le composant parle en DEBUG : c'est la que sortent us/draw et dropped.
logger:
  level: DEBUG
  logs:
    portall: DEBUG
    portall.net: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # Pas ${name} : le nom de l'appareil suivi de " Fallback Hotspot" depasse
    # les 32 caracteres qu'un SSID autorise, et esphome refuse la configuration.
    ssid: Guition PPA Fallback
    password: !secret ap_password

captive_portal:

# Le P4 n'a pas de radio : le Wi-Fi passe par un C6 en co-processeur.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  use_psram: true

esp_ldo:
  - channel: 3
    voltage: 2.5V

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall]
    refresh: 0s
  - source: github://kvj/esphome@jd9365_gsl3680
    components: [jd9365]
    refresh: 0s
  - source: github://jtenniswood/esphome-media-player@main
    components: [gsl3680]
    refresh: 0s

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

output:
  - platform: ledc
    pin: GPIO23
    id: backlight_output
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false

portall:
  display_id: main_screen
  touchscreen_id: my_touch
  port: 5000
  # La dalle, et ce que le tactile rapporte.
  width: 800
  height: 1280
  # Ce que l'hote dessine. 640x1024 est exact : 640 est sur la grille de 64
  # que decoupe l'expediteur, et 64 x 800 / 640 tombe juste, donc chaque
  # rectangle atterrit sur des pixels entiers. Verifie tuile par tuile : zero
  # trou, zero recouvrement. Mettre 400x640 pour le facteur 2 exact, ou
  # retirer les deux lignes pour revenir a la taille de la dalle.
  render_width: 640
  render_height: 1024
  rotation: 0
  max_frame_bytes: 300000
  sender_drive: false
  vendor_id: 0x303A
  product_id: 0x2986
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s
    unit_of_measurement: "dBm"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 30s

  # Ces deux-la sont la raison d'etre du fichier autant que l'image : la
  # fenetre TCP consomme de la RAM interne, le tampon du PPA de la PSRAM.
  # Le total vient de l'allocateur et n'est pas ecrit en dur -- le P4 a 768 Ko
  # de L2MEM, pas les 512 d'un ESP32-S3.
  - platform: template
    name: "SRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      return (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / 1024.0;

  - platform: template
    name: "PSRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0)
        return 0.0;
      return (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / (1024.0 * 1024.0);

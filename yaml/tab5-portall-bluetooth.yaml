# M5Stack Tab5: a Home Assistant panel over Wi-Fi whose sound comes out of a
# Bluetooth speaker.
#
# WHY THIS FILE EXISTS. Until `usb: false` there was no way to have both: the
# ESP32-P4 has two USB OTG peripherals, a board wires each socket to one of
# them, and on the Tab5 the USB-A HOST socket -- where the Bluetooth dongle
# goes -- is the SAME high-speed peripheral portall puts in DEVICE mode. So
# every log in this project's Bluetooth thread came from a firmware with
# `portall_bt:` and no `portall:` at all: a Classic host driving a screen that
# was showing nothing. This is the two of them on one board.
#
# WHAT IT NEEDS BESIDE THE BOARD. A USB Bluetooth dongle in the USB-A socket
# (both a Broadcom BCM20702A1 and a TP-Link UB500 are proven), the portall
# add-on running on the Home Assistant box, and an A2DP speaker to pair with.
# `micro_wake_word` and `voice_assistant` are deliberately NOT here: they pull
# esp-tflite-micro, which this repository records as OOM-killing the compile,
# and they are orthogonal to what this file demonstrates. Copy them from
# yaml/tab5-portall-screen.yaml if the panel wants Assist as well.

substitutions:
  name: tab5-portall-bluetooth

esphome:
  name: tab5-portall-bluetooth
  friendly_name: tab5_portall_bluetooth

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # A panel taking twenty-four pictures a second is not a sensor that speaks
  # once a minute: a radio that sleeps between beacons adds latency and lets
  # the access point buffer a burst that was meant to arrive smoothly.
  power_save_mode: none
  ap:
    ssid: tab5-bt Fallback
    password: ""

captive_portal:

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: false
  slot: 1

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall, portall_bt]
    refresh: 0s

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  # The dongle's power. Without this the USB-A socket is dead and portall_bt
  # reports no device at all, which reads exactly like a dongle that does not
  # work.
  - platform: gpio
    id: usb_5v_power
    name: USB-A Power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: wifi_antenna_int_ext
    internal: True
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0

  # Bluetooth off and on, from the dashboard. What "off" does is narrower than
  # the word: both profiles hang up and the panel stops PAGING for the devices
  # it remembers. The dongle stays enumerated and Bluedroid stays running --
  # taking those apart at runtime is a far bigger change than this is worth.
  # What it buys is the paging, which is the only radio time being spent while
  # nothing is connected, beside a C6 whose antenna is centimetres away.
  - platform: portall_bt
    name: "Bluetooth"
    id: bt_enabled
    icon: mdi:bluetooth
    restore_mode: RESTORE_DEFAULT_ON

# ---------------------------------------------------------------------------
# The Tab5's own sound. ES8388 as the codec and ES7210 for the microphones,
# both on the one I2S bus, exactly as the panel is wired.
# ---------------------------------------------------------------------------
i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_dac:
  - platform: es8388
    id: es8388_dac

select:
  - platform: es8388
    dac_output:
      id: dac_output_select
      name: "DAC Output"
    adc_input_mic:
      name: "ADC Input Mic"

speaker:
  # The panel's own loudspeaker, on the Tab5's ES8388. It is the fallback and
  # the one-line swap: point the mixer's `output_speaker:` below at this
  # instead and the whole chain comes out of the panel again.
  - platform: i2s_audio
    id: tab5_speaker
    i2s_audio_id: mic_bus
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 44100

  # The Bluetooth one. 44100 Hz, 16-bit -- hardcoded in Espressif's
  # btc_a2dp_source.c, not a preference -- and it duplicates a mono sample
  # onto both channels itself. The VOLUME is applied here too, in software:
  # every block above passes set_volume() on to its output speaker, and an
  # i2s_audio speaker ends that chain at a codec's own register while this one
  # has no codec to end it at.
  - platform: portall_bt
    id: bt_speaker
    portall_bt_id: dongle

  # 48000 -> 44100, and it is NOT optional. Everything upstream runs at 48000
  # because that is what a browser produces; A2DP decodes at 44100 whatever
  # arrives, so without this the panel plays fast and high. It sits between
  # the mixer and the speaker rather than in front of one source, because
  # there is one rate to change and it is the whole output's.
  - platform: resampler
    id: to_bluetooth
    output_speaker: bt_speaker
    # Spelt out because the MIXER above inherits this from its output speaker,
    # and a resampler's own default for it is the word `passthrough` -- which
    # the mixer's schema then refuses with "Expected integer, but cannot parse
    # passthrough as an integer", naming a component nobody wrote wrong.
    bits_per_sample: 16

  # And the mixer, which is how ESPHome shares one output between several
  # sources -- the shape yaml/GUITION_ PORTAL.yaml already uses.
  #
  # `timeout: never` ON EVERY SOURCE is the part that is easy to leave out and
  # impossible to diagnose. A source speaker's `timeout:` DEFAULTS TO 500 ms:
  # half a second with nothing to play and it STOPS, and the next sound has to
  # start it again -- through finish() on the output, a restart of the mixer's
  # own task and a fresh A2DP stream. On a dashboard that is silent between
  # announcements that happens constantly, and from a car receiver it is sound
  # that keeps cutting out and coming back.
  - platform: mixer
    id: mixing_speaker
    output_speaker: to_bluetooth
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      # The page's own sound. Its own input, so a Home Assistant announcement
      # lands OVER the page rather than fighting it, and stopping one does not
      # stop the other.
      - id: portall_mixing_input
        timeout: never

display:
  - platform: mipi_dsi
    id: main_screen
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: bsp_bus
    update_interval: 8ms
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

media_player:
  # Home Assistant's own audio, which is a different thing from the page's and
  # always was. Both pipelines are 48000 so that every source into the mixer
  # agrees, and that is a REQUIREMENT rather than a tidiness:
  # MixerSpeaker::start() takes its rate from the first source to start and
  # then returns ESP_ERR_INVALID_ARG for any later source at a different one --
  # which surfaces as "Incompatible audio streams" on the source that lost,
  # and as an announcement that is simply never heard.
  - platform: speaker
    name: "Tab5"
    id: speaker_player
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcement_mixing_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_mixing_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1

number:
  # The page's volume, and it is a SETTING rather than a following entity:
  # `restore_value` and an `initial_value` are what make a panel come back at
  # the level somebody left it. That is why `portall.set_volume` exists as an
  # action -- a template number had nothing to call before it, which is the
  # one thing that was missing, not the template number itself.
  #
  # The slider runs to 100 and every volume in ESPHome is a FRACTION, so the
  # lambda divides. Leaving that out is the mistake this will really see, and
  # set_audio_volume clamps and says so rather than failing a boot.
  - platform: template
    name: "Volume"
    id: panel_volume
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      then:
        - portall.set_volume:
            volume: !lambda 'return x / 100.0;'

portall:
  id: panel
  display_id: main_screen
  width: 720
  height: 1280
  rotation: 0
  port: 5000
  touchscreen_id: touch_screen

  # THE LINE THIS WHOLE FILE IS ABOUT. The Tab5's USB-A host socket and
  # portall's device mode are the same peripheral, so a board hosting a
  # Bluetooth dongle cannot also be a USB display. TinyUSB is left out of the
  # build entirely -- no vendor pipe, no HID digitizer, no USB sound card, no
  # sender drive -- and the picture, the touches and the sound all arrive over
  # `port:` above, which is the only way in left.
  usb: false

  # The page's sound goes into its own mixer input, which is where a source
  # belongs -- not straight at a speaker. From there it is mixed with Home
  # Assistant's audio, resampled to 44100 and sent to the paired device.
  speaker_id: portall_mixing_input

portall_bt:
  id: dongle

  # Bluedroid, host only, with the dongle as the controller. The ESP32-P4 has
  # no Bluetooth radio of any kind -- SOC_BT_SUPPORTED is not defined for it --
  # so this is Espressif's own dual-mode host driving somebody else's chip over
  # USB.
  host_stack: bluedroid

  # A2DP source. This is the half of the work the ESP32-C6 on these panels can
  # never do: A2DP is Bluetooth CLASSIC and that radio is BLE only.
  audio: true

  # No test tone: there is a real source plumbed in above. Set it to 440 to
  # hear the chain before trusting it -- it plays whenever nothing else has
  # been fed in, which on a silent page is all the time.
  test_tone: 0

  # A gamepad or a remote. ON, and it used to be off with the comment "nothing
  # here has one to pair with" -- which stopped being true the day an NVIDIA
  # Shield controller paired with a panel and drove the launcher. The same
  # pair button below finds either kind, since the class of device is what
  # sorts a speaker from a joystick.
  #
  # Turn it off if this panel will only ever have a speaker: it is a whole HID
  # host's worth of flash for a profile nothing uses.
  hid: true

  device_name: "Tab5"

  # The buttons of every input device this component can read go to the panel,
  # and that is the whole configuration. A television remote's arrows, its OK
  # and its Back arrive over AVRCP as SELECT, UP, DOWN, LEFT, RIGHT and EXIT --
  # the specification's own commands -- and a Bluetooth keyboard's arrive as
  # HID usages. Neither needs anything written here, because neither needs
  # anything guessed.
  #
  # And its MENU button leaves the page altogether, back to this panel's own
  # url:. That is the only button on a remote that can, and without it the way
  # out of an open link was a finger held in the corner of the glass -- which
  # is no use to somebody sitting down with a remote in their hand. Back stays
  # Escape, which is back WITHIN the page.
  #
  # A GAMEPAD IS COVERED TOO, and this comment used to say the opposite -- "its
  # report layout differs per device and is only knowable from its own report
  # descriptor", which is true and stopped being an obstacle: every HID device
  # carries that descriptor, Bluedroid hands it over whole when the device
  # connects, and this component reads it. So the d-pad is the arrows, A is
  # Enter, B and Back are Escape and Home leaves the link, on a controller
  # nobody had to measure first. Its raw bytes still reach `on_hid_report`
  # below for anything the mapping has no meaning for.
  # `true` and not an id: there is one `portall:` per board and nobody should
  # have to go and read their own. An id still works for a configuration that
  # wants to be explicit -- and copying THIS line with an id in it is what
  # made somebody's `portall:` named `udisp` fail to validate.
  keys: true

  on_media_key:
    - lambda: |-
        // Still here, and it is a different question: this is every button
        // including play, pause and next, which mean what they say rather than
        // meaning "move down a tile".
        ESP_LOGI("panel", "button %02x %s", code, pressed ? "down" : "up");

  on_media_volume:
    - lambda: |-
        // A fraction, because AVRCP carries 0..127 and no YAML should have to
        // know that. Sent straight at the one volume this board has.
        id(panel_volume).make_call().set_value(volume * 100.0f).perform();

# ---------------------------------------------------------------------------
# What this panel has paired, in one place. Two entries -- a speaker and the
# input devices -- and the second one is a LIST on one line rather than an
# entity per slot: a slot is not something a household chose, so one card per
# slot would put three empty ones on this device page for every panel with a
# single gamepad.
#
# The speaker stays at one device and that is structural: A2DP source is a
# single stream with one encoder. Up to four input devices are remembered, and
# every one of them reconnects BY ADDRESS -- which is what lets this component
# come back without an inquiry, and an inquiry takes this panel's own Wi-Fi
# down for as long as it runs, measured twice on this board.
#
# BOTH ENTRIES, because `hid: true` above. This block carried only `speaker:`
# while hid was off, on the rule that an entity which can only ever read
# `none` is worse than no entity -- so if this panel will only have a speaker,
# take `input:` back out along with `hid:`.
#
# Each device reads as its NAME, its address and whether it is connected:
# `none`, `<name> (<addr>) connected`, `... paired, away`, or `(Bluetooth
# off)`. The name lives in RAM, so a panel that has just restarted shows the
# address alone until the device comes back and answers a name request.
# ---------------------------------------------------------------------------
text_sensor:
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker"
      icon: mdi:speaker-bluetooth
    # A REMOTE LANDS HERE TOO. A Bluetooth remote pairs over HID exactly as a
    # gamepad does, so this one entry is both and there is no third to add for
    # one -- and a panel can now hold both at once rather than the last one
    # paired replacing the other:
    #   Orange TV remote (A4:C1:38:9E:22:07) connected,
    #   NVIDIA Controller v01.04 (00:04:4B:93:A9:B2) paired, away
    input:
      name: "Bluetooth remotes and controllers"
      icon: mdi:remote

button:
  # Pairing is an ACTION and never a loop. An inquiry sweeps the whole 2.4 GHz
  # band at full power and was measured taking this board's Wi-Fi down for
  # exactly as long as it ran, twice, on two different channels -- which on a
  # panel fed over Wi-Fi is the picture stopping. Everything afterwards
  # reconnects BY ADDRESS, which scans nothing at all.
  #
  # It is named for neither device on purpose: ONE button finds both, and
  # offering two would be two ten-second Wi-Fi outages where one does.
  #
  # PAIR MEANS ADD. A device this panel already has is passed over during the
  # scan and nothing connected is hung up -- so the music keeps playing and a
  # gamepad stays in somebody's hands while a new remote is paired. Replacing
  # one that is already here is what the Forget buttons below are for, and the
  # log names the right one when it skips something.
  - platform: template
    name: "Pair a Bluetooth device"
    on_press:
      - portall_bt.pair: dongle

  # One KIND at a time, which is what somebody looking at the entity above
  # actually wants: the speaker has been replaced, the controllers have not.
  # There is no per-device button and that is deliberate -- one would need an
  # index a household has no way to read, and the way to make room when all
  # four input slots are full is to clear them and pair again.
  - platform: template
    name: "Forget Bluetooth speaker"
    entity_category: config
    on_press:
      - portall_bt.forget_speaker: dongle

  - platform: template
    name: "Forget Bluetooth controllers"
    entity_category: config
    on_press:
      - portall_bt.forget_input: dongle

  # Every bond at once. Kept beside the one above because a panel that has got
  # into a state nobody can explain wants the big hammer, and it is the only
  # one that also clears a bond this component never recorded a role for.
  - platform: template
    name: "Forget Bluetooth devices"
    entity_category: config
    on_press:
      - portall_bt.forget: dongle

substitutions:
  name: korvo-s31
  friendly_name: Korvo S31

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s31
  toolchain: esp-idf
  framework:
    type: esp-idf
    version: 6.1.0

psram:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO0
  scl: GPIO1
  scan: true

display:
  - platform: mipi_rgb
    id: main_display
    model: CUSTOM
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    enable_pin: GPIO38
    de_pin: GPIO43
    pclk_pin: GPIO40
    hsync_pin: GPIO44
    vsync_pin: GPIO45
    pclk_frequency: 18MHz
    pclk_inverted: true
    hsync_pulse_width: 40
    hsync_back_porch: 40
    hsync_front_porch: 48
    vsync_pulse_width: 23
    vsync_back_porch: 32
    vsync_front_porch: 13
    data_pins:
      red: [GPIO19, GPIO33, GPIO34, GPIO35, GPIO36]
      green: [GPIO13, GPIO14, GPIO15, GPIO16, GPIO17, GPIO18]
      blue: [GPIO8, GPIO9, GPIO10, GPIO11, GPIO12]
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    address: 0x14
    transform:
      mirror_x: false
      mirror_y: false

external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.7.0
    components: [esp_audio_stack]

esp_audio_stack:
  id: audio_stack
  sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 32
  num_channels: 1

  i2s_bclk_pin: GPIO3
  i2s_lrclk_pin: GPIO4
  i2s_din_pin: GPIO6
  i2s_dout_pin: GPIO5

  codec:
    input:
      type: es8389
      use_mclk: false
    output:
      type: es8389
      use_mclk: false

  on_amplifier_required:
    then:
      - switch.turn_on: speaker_amp
  on_amplifier_idle:
    then:
      - switch.turn_off: speaker_amp

switch:
  - platform: gpio
    id: speaker_amp
    pin: GPIO7
    restore_mode: ALWAYS_OFF

microphone:
  - platform: esp_audio_stack
    id: mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: spk
    esp_audio_stack_id: audio_stack
    sample_rate: 16000
    bits_per_sample: 16
    buffer_duration: 500ms

media_player:
  - platform: speaker
    name: "Korvo Speaker"
    id: korvo_player
    announcement_pipeline:
      speaker: spk
      format: WAV
      sample_rate: 16000
      num_channels: 1

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  color_depth: 16
  pages:
    - id: main_page
      widgets:
        - label:
            align: CENTER
            text: "ESP32-S31 Korvo-1"

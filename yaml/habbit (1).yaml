              - obj:
                  width: 100%
                  height: 24
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        text: "WiFi Signal:"
                        text_font: roboto_16
                        text_color: color_white
                    - label:
                        id: wifi_signal_label
                        align: RIGHT_MID
                        text: "0 dBm"
                        text_font: roboto_16
                        text_color: color_white

              # --- IP Address ---
              - obj:
                  width: 100%
                  height: 24
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        text: "IP Address:"
                        text_font: roboto_16
                        text_color: color_white
                    - label:
                        id: ip_address_label
                        align: RIGHT_MID
                        text: "192.168.3.3"
                        text_font: roboto_16
                        text_color: color_white
                        

      on_swipe_up:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.show: page_home
        - light.turn_on: 
            id: backlight
            flash_length: 50ms                           
####################################################################################################################################################################################################





key_collector:
  - source_id: alarm_panel_keypad
    min_length: 4
    max_length: 4
    end_keys: "#"
    end_key_required: true
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 5s
    on_progress:
      - if:
          condition:
            lambda: return (0 != x.compare(std::string{""}));
          then:
            - lvgl.label.update:
                id: alarm_panel_keypad_code_label
                text: !lambda 'return x.c_str();'
          else:
            - lvgl.label.update:
                id: alarm_panel_keypad_code_label
                text_font: nunito_36
                text_color: color_misty_blue
                text: "Enter code"
    on_result:      
      - if:
          condition:
            lambda: 'return x == "${pin_code}";'
          then:
            # Если код верный, отправляем команду в Home Assistant для снятия с охраны

            - if:
                condition:
                  lambda: 'return id(alarm_panel_pending_action) == "disarm";'
                then:
                  - homeassistant.action:
                      action: alarm_control_panel.alarm_disarm
                      data:
                        entity_id: "${alarm_panel_entity}"
                        code: "${pin_code}"
            - if:
                condition:
                  lambda: 'return id(alarm_panel_pending_action) == "arm_home";'
                then:
                  - homeassistant.action:
                      action: alarm_control_panel.alarm_arm_home
                      data:
                        entity_id: "${alarm_panel_entity}"
                        code: "${pin_code}"

            - if:
                condition:
                  lambda: 'return id(alarm_panel_pending_action) == "arm_away";'
                then:
                  - homeassistant.action:
                      action: alarm_control_panel.alarm_arm_away
                      data:
                        entity_id: "${alarm_panel_entity}"
                        code: "${pin_code}"

            - if:
                condition:
                  lambda: 'return id(alarm_panel_pending_action) == "arm_night";'
                then:
                  - homeassistant.action:
                      action: alarm_control_panel.alarm_arm_night
                      data:
                        entity_id: "${alarm_panel_entity}"
                        code: "${pin_code}"

            - if:
                condition:
                  lambda: 'return id(alarm_panel_pending_action) == "arm_vacation";'
                then:
                  - homeassistant.action:
                      action: alarm_control_panel.alarm_arm_vacation
                      data:
                        entity_id: "${alarm_panel_entity}"
                        code: "${pin_code}"

            - lvgl.widget.hide: alarm_panel_keypad_page
            - lvgl.widget.show: alarm_panel_state_bg
            - lvgl.widget.show: alarm_panel_state_control                                                                                
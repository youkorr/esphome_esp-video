interval:

  - interval: 80ms
    then:
      - lambda: |-
          if (id(f2f).has_new_remote_frame()) {
            const uint8_t *rgb = id(f2f).remote_rgb565();
            if (rgb != nullptr) {
              lv_canvas_set_buffer(id(remote_video), (void*)rgb,
                  id(f2f).remote_width(), id(f2f).remote_height(),
                  LV_COLOR_FORMAT_RGB565);
              lv_obj_invalidate(id(remote_video));
            }
          }
          bool on = id(f2f).peer_online();
          lv_obj_set_style_bg_color(id(presence_dot),
              lv_color_hex(on ? 0x22C55E : 0x64748B), 0);
          lv_label_set_text(id(presence_label), on ? "En ligne" : "Hors ligne");

  - interval: 30s
    then:
      - lambda: |-
          size_t free_int = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          ESP_LOGI("mem", "Internal free: %u KB | PSRAM free: %u KB",
                   (unsigned)(free_int / 1024),
                   (unsigned)(free_psram / 1024));


  - interval: 60s
    then:
      - lambda: |-
          // Log real memory usage
          const size_t total_sram = 512 * 1024;
          const size_t total_psram = 8 * 1024 * 1024;
          
          size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t used_sram = total_sram - free_sram;
          
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          size_t used_psram = total_psram - free_psram;
          
          ESP_LOGI("system_info", "SRAM: %u/%u KB used (%.1f%%)", 
                   used_sram/1024, total_sram/1024, 
                   (used_sram * 100.0) / total_sram);
          
          if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) > 0) {
            ESP_LOGI("system_info", "PSRAM: %u/%u MB used (%.1f%%)", 
                     used_psram/(1024*1024), total_psram/(1024*1024),
                     (used_psram * 100.0) / total_psram);
          } else {
            ESP_LOGI("system_info", "PSRAM: Not available");
          }

  - interval: 60s
    then:
      - lambda: |-
          // Log real memory usage (M5Stack Tab5 ESP32-P4: 800KB SRAM, 32MB PSRAM)
          const size_t total_sram = 800 * 1024;
          const size_t total_psram = 32 * 1024 * 1024;
          
          size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t used_sram = total_sram - free_sram;
          
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          size_t used_psram = total_psram - free_psram;
          
          ESP_LOGI("system_info", "SRAM: %u/%u KB used (%.1f%%)", 
                   (unsigned)(used_sram/1024), (unsigned)(total_sram/1024), 
                   (used_sram * 100.0) / total_sram);
          
          if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) > 0) {
            ESP_LOGI("system_info", "PSRAM: %u/%u MB used (%.1f%%)", 
                     (unsigned)(used_psram/(1024*1024)), (unsigned)(total_psram/(1024*1024)),
                     (used_psram * 100.0) / total_psram);
          } else {
            ESP_LOGI("system_info", "PSRAM: Not available");
          }

  - interval: 60s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda 'return id(esptime).now().strftime("%H:%M");'
  #- interval: 10s
    #then:
      #- if:
          #condition:
            #lambda: 'return !id(notification);'
          #then:
            #- lvgl.image.update:
                #id: animation_widget
                #src: img_animation_iddle
            #- delay: 1s
            #- lvgl.image.update:
                #id: animation_widget
                #src: img_animation_active

## Calendar
  - interval: 5min
    then:
      - script.execute: refresh_calendar_widget

  - interval: 60s
    then:
      - lvgl.bar.update:
          id: lbl_home_calendar_progress_bar
          value: !lambda |-
            if (id(calendar_state).state != "on")
              return 0;
            if (!id(calendar_event_start).has_state() || !id(calendar_event_end).has_state())
              return 0;
            std::string start = id(calendar_event_start).state;
            std::string end_s = id(calendar_event_end).state;
            if (start.empty() || end_s.empty())
              return 0;
            int sy, sm, sd, sh, smin, ss, ey, em, ed, eh, emin, es;
            sscanf(start.c_str(), "%d-%d-%dT%d:%d:%d", &sy, &sm, &sd, &sh, &smin, &ss);
            sscanf(end_s.c_str(), "%d-%d-%dT%d:%d:%d", &ey, &em, &ed, &eh, &emin, &es);
            auto now = id(esptime).now();
            if (!now.is_valid()) return 0;
            int now_mins = now.hour * 60 + now.minute;
            int start_mins = sh * 60 + smin;
            int end_mins = eh * 60 + emin;
            if (now_mins < start_mins) return 0;
            if (now_mins >= end_mins) return 100;
            return (int)(((float)(now_mins - start_mins) / (end_mins - start_mins)) * 100.0f);
            

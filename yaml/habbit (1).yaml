# ============================================================================
# AUDIO FULL-DUPLEX — notre composant fdaudio (Espressif natif)
# ============================================================================
fdaudio:
  id: audio_engine
  lrclk_pin: GPIO29
  bclk_pin: GPIO27
  mclk_pin: GPIO30
  din_pin: GPIO28
  dout_pin: GPIO26
  i2c_port: 0
  output_codec: es8388
  output_address: 0x10
  mic_address: 0x40
  mic_gain_db: 37.5
  output_volume: 70
  sample_rate: 16000
  enable_aec: false            # AEC -> micro nettoyé (rend le barge-in fiable)

microphone:
  - platform: fdaudio
    id: tab5_microphone
    fdaudio_id: audio_engine

speaker:
  - platform: fdaudio
    id: tab5_speaker
    fdaudio_id: audio_engine
  

micro_wake_word:
  id: mww
  models:
    - okay_nabu
#    - hey_mycroft
#    - hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - lvgl.page.show: page_assistant
    - light.turn_on: backlight
    - lvgl.resume:
    - lvgl.widget.redraw:

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable



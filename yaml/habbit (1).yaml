# ============================================================================
binary_sensor:
  
  - platform: template
    name: "Pair connecté"
    id: peer_connected
    device_class: connectivity
    lambda: "return id(f2f).peer_online();"


  - platform: gpio
    id: charging
    name: "Charg"
    icon: mdi:battery-charging
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    filters:
      - delayed_on: 2s       
      - delayed_off: 2s     
    on_state:
      then:
      - lvgl.label.update:
          id: lbl_battery_percentage
          text:
            format: "%.0f%%"
            args:
              - id(battery_percentage).state
      - lvgl.label.update:
          id: battery_icon
          text: !lambda |-
            if (id(charging).state) return "\U0000f250";  
            float pct = x;
            if (pct >= 70.0) return "\U0000f24f";
            if (pct >= 30.0) return "\U0000f255";
            return "\U0000f257";
          text_color: !lambda |-
            float pct = id(battery_percentage).state;
            if (id(charging).state) return lv_color_hex(0xe6b854);
            if (pct >= 70.0) return lv_color_hex(0xc9e654);
            if (pct >= 30.0) return lv_color_hex(0xe65476);
            return lv_color_hex(0x767676);

  #- platform: gpio
    #id: headphone_detect
    #name: "Headphone Detect"
    #internal: true
    #pin:
      #pi4ioe5v6408: pi4ioe1
      #number: 7
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7
      # Important: vérifiez si le pin doit être inversé selon votre hardware
      inverted: false  # Ajustez selon votre circuit
    on_press:
      # Casque détecté - désactiver le speaker et configurer l'ES8388
      then:
        - logger.log: "Casque détecté - basculement vers sortie casque"
        - switch.turn_off: speaker_enable
        - select.set:
            id: dac_output_select
            option: "Line 1"  # Casque sur Line 1
    on_release:
      # Casque déconnecté - réactiver le speaker
      then:
        - logger.log: "Casque déconnecté - basculement vers speaker"
        - switch.turn_on: speaker_enable
        - select.set:
            id: dac_output_select
            option: "Line 1"  # TEST: Speaker aussi sur Line 1
  # Devices
  # Dispositivos

  # VACUUM

  - platform: homeassistant
    id: device_vacuum_water
    entity_id: ${vacuum_water}
    internal: true
    filters:
      - delayed_on: 10min     
    on_press:
      then:
        - lvgl.label.update:

  - platform: homeassistant
    id: vacuum_cleaning_time_value
    entity_id: ${vacuum_cleaning_time}
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_device_vacuum_cleaning_time
            text: !lambda |-
              if (isnan(x) || x <= 0) {
                return std::string("Aucun nettoyage en cours");
              }
              int minutes = (int)x;
              int hours = minutes / 60;
              int mins = minutes % 60;
              char buffer[40];
              if (hours > 0) {
                snprintf(buffer, sizeof(buffer), "Nettoyage %dh %02dm", hours, mins);
              } else {
                snprintf(buffer, sizeof(buffer), "Nettoyage %dm", minutes);
              }
              return std::string(buffer);
        - lvgl.label.update:
            id: lbl_home_vacuum_cleaning_time
            text: !lambda |-
              if (isnan(x) || x <= 0) {
                return std::string("Aucun nettoyage en cours");
              }
              int minutes = (int)x;
              int hours = minutes / 60;
              int mins = minutes % 60;
              char buffer[40];
              if (hours > 0) {
                snprintf(buffer, sizeof(buffer), "Nettoyage %dh %02dm", hours, mins);
              } else {
                snprintf(buffer, sizeof(buffer), "Nettoyage %dm", minutes);
              }
              return std::string(buffer);

  - platform: template
    name: "SRAM Usage"
    id: sram_usage
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      // Total SRAM size for M5Stack Tab5 ESP32-P4 = 800 KB
      const size_t total_sram = 800 * 1024;
      size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
      size_t used_sram = total_sram - free_sram;
      return used_sram / 1024.0; // Retourne la mémoire utilisée en KB
    on_value:
      then:
        - lvgl.bar.update:
            id: sram_memory_bar
            value: !lambda |-
              const size_t total_sram = 800 * 1024;
              size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
              size_t used_sram = total_sram - free_sram;
              return (int)(((double)used_sram / total_sram) * 100);
        - lvgl.label.update:
            id: sram_memory_label
            text: !lambda |-
              const size_t total_sram = 800 * 1024;
              size_t free_sram = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
              size_t used_sram = total_sram - free_sram;
              static char sram_buf[32];
              snprintf(sram_buf, sizeof(sram_buf), "%.1f/%.0f KB", 
                      used_sram/1024.0, total_sram/1024.0);
              return sram_buf;

  - platform: template
    name: "PSRAM Usage"
    id: psram_usage
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      // Total PSRAM size for M5Stack Tab5 ESP32-P4 = 32 MB
      const size_t total_psram = 32 * 1024 * 1024;
      size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
      
      if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) == 0) {
        return 0.0;
      }
      
      size_t used_psram = total_psram - free_psram;
      return used_psram / (1024.0 * 1024.0); // Retourne la mémoire utilisée en MB
    on_value:
      then:
        - lvgl.bar.update:
            id: psram_memory_bar
            value: !lambda |-
              const size_t total_psram = 32 * 1024 * 1024;
              size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
              
              if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) == 0) return 0;
              
              size_t used_psram = total_psram - free_psram;
              return (int)(((double)used_psram / total_psram) * 100);
        - lvgl.label.update:
            id: psram_memory_label
            text: !lambda |-
              const size_t total_psram = 32 * 1024 * 1024;
              size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
              static char psram_buf[32];
              
              if (heap_caps_get_total_size(MALLOC_CAP_SPIRAM) == 0) {
                snprintf(psram_buf, sizeof(psram_buf), "No PSRAM");
              } else {
                size_t used_psram = total_psram - free_psram;
                snprintf(psram_buf, sizeof(psram_buf), "%.1f/%.0f MB", 
                        used_psram/(1024.0*1024.0), total_psram/(1024.0*1024.0));
              }
              return psram_buf;

              

switch:

  - platform: ip_camera_viewer
    id: cam
    camera_id: security_cam_1
    restore_mode: ALWAYS_OFF      # PAS ALWAYS_ON  

  - platform: template
    name: "LVGL Camera Display"
    id: lvgl_display_enable_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);  
          if (lvgl_disp != nullptr) {
            lvgl_disp->set_enabled(true);
          }
    turn_off_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);  
          if (lvgl_disp != nullptr) {
            lvgl_disp->set_enabled(false);
          }  

  #- platform: template
    #name: "Robot Play"
    #icon: "mdi:play-pause"
    #optimistic: true
    #turn_on_action:
      #- lvgl.lottie.start: my_robot
    #turn_off_action:
      #- lvgl.lottie.pause: my_robot


  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3

  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true

  - platform: gpio
    id: charge_enable
    name: "Charge"
    restore_mode: ALWAYS_OFF
    internal: False
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7

  - platform: gpio
    id: wifi_antenna_int_ext
    internal: True
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0

  - platform: gpio
    id: speaker_enable
    name: "Haut-parleur"
    icon: mdi:volume-high
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    on_state:
      then:
      - lvgl.label.update:
          id: speaker_icon
          text: !lambda |-
            if (id(speaker_enable).state) return "\U0000e98e";  
            return "\U0000e04f";

              for (int m = 1; m < month; m++) { days += days_in_month[m - 1]; }
              days += day - 1;
              time_t finish_ts = days * 86400L + hour * 3600L + minute * 60L + second;
              time_t now_ts = id(esptime).now().timestamp;
              long remaining = (long)finish_ts - (long)now_ts;

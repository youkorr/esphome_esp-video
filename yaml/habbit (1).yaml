# ============================================================================
# APPEL VIDÉO + AUDIO — face2face (lit le micro déjà nettoyé par fdaudio)
# ============================================================================
face2face:
  id: f2f
  camera_id: tab5_cam
  microphone_id: tab5_microphone
  speaker_id: tab5_speaker
  enable_audio: true
  enable_aec: false           # AEC faite par fdaudio (ne pas la refaire)
  scale: 2
  jpeg_quality: 35
  framerate: 10
  swap_colors: true
  ring_timeout: 30s
  #amplifier: audio_amplifier
  #video_port: 9000      # à rediriger en UDP sur la box
  #audio_port: 9001      # à rediriger en UDP sur la box
  #contacts:
    #- name: "Tab5"
      #host: 192.168.1.17
  on_ringing:
    - lvgl.widget.show: incoming_overlay
    - lvgl.page.show: call_page
  on_outgoing_call:
    - lvgl.page.show: call_page
  on_streaming:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - lambda: "id(audio_engine)->set_echo_suppression(0);"       
    #- switch.turn_off: face_detect_switch   
    - lambda: "id(camera_display)->set_enabled(false);"
    - lvgl.widget.hide: incoming_overlay
    - lvgl.page.show: call_page
  on_idle:
    - lambda: "id(audio_engine)->set_echo_suppression(0);"    
    #- switch.turn_on: face_detect_switch 
    - lambda: "id(camera_display)->set_enabled(true);"
    - micro_wake_word.start:
    - lvgl.widget.hide: incoming_overlay


button:
  - platform: template
    name: "Appeler"
    on_press: [ face2face.call: f2f ]
  - platform: template
    name: "Décrocher"
    on_press: [ face2face.answer: f2f ]
  - platform: template
    name: "Raccrocher"
    on_press: [ face2face.hangup: f2f ]

text:
  - platform: template
    name: "IP correspondant"
    id: peer_ip_input
    icon: "mdi:ip-network"
    mode: text
    optimistic: true
    restore_value: true
    pattern: '^(\d{1,3}\.){3}\d{1,3}$'
    on_value:
      - lambda: "id(f2f).set_peer_ip(x);" 





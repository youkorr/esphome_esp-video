# The canvas test, on the household's own LVGL (youkorr/lvgl_9.5) instead of
# ESPHome's. Asked as "il me semble avoir eu le meme probleme avec lvgl de
# chez esphome que je n'ai pas retrouve sur mon lvgl".
#
# The same board, the same canvas and the same portall block as
# tab5-portall-canvas.yaml; only the lvgl: component and three of its lines
# differ. On ESPHome's lvgl a whole 1280x620 picture measured ~35 ms of copy
# plus ~65 ms of LVGL redrawing it, turning it and flushing it -- 9 pictures
# a second. What this one changes about that second half:
#   - use_ppa: the canvas is an opaque RGB565 image, which the fork's PPA draw
#     unit takes (lv_draw_ppa.tcc, LV_DRAW_TASK_TYPE_IMAGE) instead of the CPU;
#   - buffer_size: 100%: one render pass per picture instead of four;
#   - rotation: 270 through the fork's own PPA rotation, whose touch mapping
#     (rotate_touch_point) is the one portall's canvas_turn_ already inverts.
# Not compiled here and not run: the board's "waited N ms/s for LVGL" line
# beside the old one is what says whether it helps.
substitutions:
  name: tab5-portall-canvas-ppa
  bar: "100"

esphome:
  name: tab5-portall-canvas-ppa
  friendly_name: tab5_portall_canvas

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

logger:

api:
  encryption:
    key: !secret api_encryption_key

psram:
  mode: hex
  speed: 200MHz
  ignore_not_found: false

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

ota:
  - platform: esphome

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: false
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: bar_clock
              text: !lambda 'return id(ha_time).now().strftime("%H:%M");'

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl, image, font]
    refresh: 1d

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
  - id: pi4ioe2
    address: 0x44

switch:
  - platform: gpio
    id: wifi_power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON
    on_turn_on:
      - portall.wake
    on_turn_off:
      - portall.sleep

touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: bsp_bus
    update_interval: 8ms
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280

display:
  - platform: mipi_dsi
    id: main_screen
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

lvgl:
  displays: main_screen
  touchscreens: touch_screen
  color_depth: 16
  # One render pass per picture: the canvas is most of the screen, so a
  # quarter buffer drew it in four.
  buffer_size: 100%
  # The fork's PPA draw unit: an opaque RGB565 image -- the canvas -- is
  # copied by the accelerator rather than by the CPU.
  use_ppa: true
  # The Tab5 held in landscape. LVGL turns the WHOLE screen, the canvas with
  # it, so portall's own rotation: stays 0 and the add-on's rotate: is "0" --
  # the page is drawn the way it is seen. Contacts are turned to match from
  # this same setting, read at compile time.
  rotation: 270
  pages:
    - id: home
      bg_color: 0x10141c
      widgets:
        # The board's own part of the screen: this is what works with the
        # server down, which is the point of the test.
        - label:
            id: bar_clock
            x: 24
            y: 30
            text: "--:--"
            text_color: 0xe6e9ef
            text_font: montserrat_28
        # The page. Same size as portall's width:/height: below.
        - canvas:
            id: page_canvas
            x: 0
            y: ${bar}
            width: 1280
            height: 620

portall:
  display_id: main_screen
  canvas: page_canvas
  width: 1280
  height: 620
  port: 5000
  # A whole 1280x620 page can weigh more than the 128 KB default, and a
  # picture over the limit is dropped: only the small rectangles would land,
  # leaving pieces of old pages on the canvas.
  max_frame_bytes: 300000
  usb: false
  touchscreen_id: touch_screen

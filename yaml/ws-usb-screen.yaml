substitutions:
  name: ws-usb-screen
  
  micro_wake_word_model: okay_nabu

esphome:
  name: ws-usb-screen
  friendly_name: ws-usb-screen

esp32:
  board: esp32-p4-evboard
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

logger:

api:
  encryption:
    key: "D1AIF4OzvQhGTdgRdt9pj08QtMk3lk9vgUa727W6LBE="
psram:
  mode: hex
  speed: 200MHz

# LDO du PHY MIPI : necessaire pour la DSI comme pour la CSI.
esp_ldo:
  - voltage: 2.5V
    channel: 3
i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ws-usb-screen Fallback Hotspot
    password: "XoIBpzlH5kYV"
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  #use_psram: true
  slot: 1

captive_portal:
  
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: claude/esphome-pr-outdated-mdq36w
    components: [usb_display]
    refresh: 0s
  #- source:
      #type: git
      #url: https://github.com/youkorr/face-toface
      #ref: claude/mit-license-face-to-face-p9fc6m
    #components: [fdaudio]
    #refresh: 0s
    
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12


audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: stereo
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    codec_support_enabled: true
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_play:
      - logger.log: "Media player started playing, disabling microphone"
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start



micro_wake_word:
  id: my_wake_word
  models:
        
        
    - model: https://github.com/chrisdunnname/esphome-p4-86-panel-eth-2ro-lvgl/raw/main/microwakeword/okay_hal.json
      id: okay_hal
  on_wake_word_detected:
    then:
      - logger.log: "Wake word detected"
      - voice_assistant.start:
          wake_word: !lambda return wake_word;
                                                                                     
voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
 






number:
  - platform: usb_display
    name: "Volume écran USB"
    
switch:

  - platform: gpio
    pin: GPIO53 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF 

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
    
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 20ms
    on_touch:
      - light.turn_on: backlight
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true   
display:
  - platform: mipi_dsi
    id: main_screen
    # ESPHome connait exactement ce panneau (1024x600, EK79007, reset GPIO33).
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false

usb_display:
  display_id: main_screen
  width: 1024
  height: 600
  rotation: 0
  vendor_id: 0x303A
  #product_id: 0x2987
  product_id: 0x2986           # <- la seule correction nécessaire
  sender_drive: false
  max_frame_bytes: 300000
  jpeg_quality: 6
  max_fps: 30
  manufacturer: Espressif
  product: ESP_Extern_Screen
  serial: "012-2021"
  speaker_id: esp32_speaker
  on_audio_start:
    - switch.turn_on: audio_amplifier
    - micro_wake_word.stop
  on_audio_stop:
    - micro_wake_word.start
    - switch.turn_off: audio_amplifier
    
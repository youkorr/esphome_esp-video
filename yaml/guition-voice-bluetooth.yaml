# A Guition JC8012P4A1 (800x1280) as a portall panel whose sound goes to a
# Bluetooth speaker through a USB dongle -- WITH a voice assistant: the wake
# word "Okay Nabu" heard on the panel, Home Assistant's Assist, and the answer
# spoken on the Bluetooth speaker like every other sound this panel makes.
#
# It is the household's own ha-esp32p4 Guition.yaml with four additions, each
# marked "Voice" below: the codec's sample rate, the microphone's sample
# width, a media player for the answer to be spoken through, and the wake word
# and voice assistant themselves.
#
# Why a voice assistant never worked on this board before, and why it can now
# without rebuilding anything: the microphone and the panel's own speaker share
# one I2S bus, and ESPHome gives that bus to ONE of them at a time -- a speaker
# with `timeout: never` that has started once keeps it for ever, and the
# microphone then waits for ever and the wake word hears nothing (ESPHome issue
# #16043, on an ESP32-P4). Here every sound goes to Bluetooth, so nothing ever
# starts esp32_speaker and the bus stays the microphone's. Keep it that way:
# the day something plays on esp32_speaker, the wake word goes deaf.
# yaml/guition-voice.yaml is the other case -- the panel's own speaker -- and
# needs two buses to get round it.
substitutions:
  name: ha-guit-10-p4


esphome:
  name: ha-guit-10-p4
  friendly_name: HA-GUIT-10-P4

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_ESP_HOSTED_SDIO_RX_Q_SIZE: "64"
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      # Envoi (déjà là)
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_AMPDU_TX_ENABLED: "y"
      CONFIG_WIFI_RMT_TX_BA_WIN: "32"
      # Réception : c'est le sens de la vidéo (valeurs du guide P4 + C6 d'Espressif)
      CONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_RX_BA_WIN: "32"
      CONFIG_LWIP_TCP_SACK_OUT: "y"
  
      
logger:
  level: DEBUG
  #logs:
    #esp-idf: WARN   



api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  post_connect_roaming: false
  ap:
    ssid: HA_ESP32P4 Fallback Hotspot
    password: !secret fallback_password

captive_portal:
  
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17 
  use_psram: false

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - voltage: 2.5V
    channel: 4
    
psram:
  speed: 200MHz
  ignore_not_found: false
    
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall, portall_bt]
    refresh: 0s

  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]


  - source: github://jtenniswood/esphome-media-player@main
    components: [ gsl3680 ]
    refresh: 0s


i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

# -------------------------------------------
# Audio
# ------------------------------------------- 
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

# DAC pour la sortie haut-parleur

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    # Voice: 16000, the rate the microphone runs the bus at. The codec's DAC
    # is not used on this panel -- the sound goes to Bluetooth -- so the only
    # half of the ES8311 at work is its microphone input, and it is set up for
    # the clock it actually receives.
    sample_rate: 16000


# Lit les données I2S venant du micro (GPIO11)
microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    # Voice: 16-bit, the ES8311's own width, rather than the 32-bit i2s_audio
    # picks by itself.
    bits_per_sample: 16bit
    # Which half of the frame the ES8311 puts its microphone in has not been
    # measured on this board. If Assist times out hearing nothing, this is the
    # line to change: `channel: left`.
    channel: right

speaker:
  # The panel's own loudspeaker. Nothing plays on it in this file, and that is
  # what leaves the bus to the microphone -- see the top of the file.
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    timeout: never
    channel: stereo
    buffer_duration: 300ms
    bits_per_sample: 16bit
    sample_rate: 44100

  - platform: portall_bt
    id: bt_speaker
    portall_bt_id: dongle
    num_channels: 2

  - platform: resampler
    id: to_bluetooth
    output_speaker: bt_speaker

    bits_per_sample: 16

  - platform: mixer
    id: mixing_speaker
    output_speaker: to_bluetooth
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

      - id: portall_mixing_input
        timeout: never   

# Voice: what the answer is spoken through. Home Assistant sends it as an
# announcement, which goes into the mixer beside the page's sound and on to
# the Bluetooth speaker. 48000 like portall: every source of one mixer has to
# be at the same rate, or the one that starts second is refused ("Incompatible
# audio streams") and the answer is simply never heard.
media_player:
  - platform: speaker
    name: "Media Player"
    id: speaker_media_player
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcement_mixing_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_mixing_input
      format: FLAC
      sample_rate: 48000
      num_channels: 2

# Voice: "Okay Nabu", heard on the panel itself. Never stopped, not even while
# the voice assistant is listening, so there is nothing to restart afterwards
# and no moment when the panel is deaf.
micro_wake_word:
  # Voice: laid out the way ESPHome's own voice assistants are
  # (esphome/wake-word-voice-assistants, esp32-s3-box-3.yaml): started when
  # Home Assistant connects, stopped by a detection, started again when the
  # conversation ends. So the wake word and the voice assistant are never
  # both deciding what the microphone is for.
  id: mww
  microphone: esp32_microphone
  models:
    - model: okay_nabu
  on_wake_word_detected:
    # The phrase goes with it: Home Assistant picks which assistant answers
    # by matching it against the panel's "Wake word" selects.
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_end:
    # Let the answer finish before listening again, or the wake word hears
    # the panel's own voice.
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        not:
          media_player.is_announcing:
    - micro_wake_word.start:

switch:
  - platform: gpio
    pin: GPIO20 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF 

  - platform: portall_bt
    name: "Bluetooth"
    id: bt_enabled
    icon: mdi:bluetooth
    restore_mode: RESTORE_DEFAULT_ON

  
    
binary_sensor:
  - platform: template
    name: "En charge"
    lambda: |-
      if (id(battery_voltage).state > 2.45) {
        return true;
      } else {
        return false;
      }

sensor:
  - platform: adc
    pin: GPIO52
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    update_interval: 300s
    attenuation: 12db # Scales the ESP32 ADC range to read up to ~3.6V safely
    filters:
      - multiply: 1.73 # Example multiplier to scale the divided voltage back to 
        
  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - calibrate_linear:
          - 3.2 -> 0.0
          - 4.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
          


  #- platform: wifi_signal
    #name: "WiFi Signal"
    #update_interval: 600s
    #unit_of_measurement: "dBm"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 600s


  - platform: template
    name: "SRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 600s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      return (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / 1024.0;

  - platform: template
    name: "PSRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 600s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0)
        return 0.0;
      return (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / (1024.0 * 1024.0);
      
text_sensor:
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker"
      icon: mdi:speaker-bluetooth
    input:
      name: "Bluetooth controller"
      icon: mdi:controller

    
      
            
number:
  - platform: template
    name: "Volume"
    id: panel_volume
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      then:
        - portall.set_volume:
            volume: !lambda 'return x / 100.0;'

    
  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 0
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout

script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            - light.turn_off: backlight
            #- usb_display.wake: udisp              
    

globals:
  - id: screen_off_delay
    type: int
    restore_value: yes
    initial_value: '0'


output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      - light.turn_on: backlight
      - script.execute: screen_timeout
      #- usb_display.wake: udisp        

        
      
    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false




portall:
  display_id: main_screen
  touchscreen_id: my_touch
  port: 5000
  width: 800
  height: 1280
  max_fps: 60
  jpeg_quality: 9
  rotation: 0
  usb: false
  #remote: true
  max_frame_bytes: 400000
  speaker_id: portall_mixing_input
  #on_audio_start:
    #- switch.turn_on: audio_amplifier

portall_bt:
  id: dongle
  host_stack: bluedroid
  audio: true
  test_tone: 0
  hid: true
  keys: true 
  #show_reports: true


  device_name: "Guition"

  on_media_key:
    - lambda: |-
        // The car receiver's steering wheel, or the button on an earcup.
        ESP_LOGI("panel", "button %02x %s", code, pressed ? "down" : "up");

  on_media_volume:
    - lambda: |-
        // A fraction, because AVRCP carries 0..127 and no YAML should have to
        // know that. Sent straight at the one volume this board has.
        id(panel_volume).make_call().set_value(volume * 100.0f).perform();

       

button:
  - platform: restart
    name: "P4 Restart"
  - platform: template
    name: "Pair a Bluetooth device"
    on_press:
      - portall_bt.pair: dongle

  - platform: template
    name: "Forget Bluetooth speaker"
    entity_category: config
    on_press:
      - portall_bt.forget_speaker: dongle

  - platform: template
    name: "Forget Bluetooth controller"
    entity_category: config
    on_press:
      - portall_bt.forget_input: dongle

  - platform: template
    name: "Forget Bluetooth devices"
    entity_category: config
    on_press:
      - portall_bt.forget: dongle


    

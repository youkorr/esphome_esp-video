i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

# -------------------------------------------
# Audio
# ------------------------------------------- 
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

# DAC pour la sortie haut-parleur

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    sample_rate: 16000


# Lit les données I2S venant du micro (GPIO11)
microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    adc_type: external
    sample_rate: 16000
    channel: left
    
speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    timeout: never
    channel: stereo
    buffer_duration: 300ms
    bits_per_sample: 16bit
    sample_rate: 44100

  - platform: portall_bt
    id: bt_speaker
    portall_bt_id: dongle
    num_channels: 2

 #- platform: resampler
    #id: to_bluetooth
    #output_speaker: bt_speaker

    #bits_per_sample: 16

  - platform: mixer
    id: mixing_speaker
    output_speaker: bt_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      - id: portall_mixing_input
        timeout: never
        buffer_duration: 500ms

  #- platform: resampler
    #id: portall_resampler
    #output_speaker: portall_mixing_input
    #bits_per_sample: 16
    #buffer_duration: 500ms
        
media_player:
  - platform: speaker
    name: "Media Player"
    id: speaker_media_player
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcement_mixing_input
      format: FLAC
      sample_rate: 44100
      num_channels: 1
    media_pipeline:
      speaker: media_mixing_input
      format: FLAC
      sample_rate: 44100
      num_channels: 2


micro_wake_word:

  id: mww
  microphone: esp32_microphone
  models:
    - model: okay_nabu
  on_wake_word_detected:

    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - if:
        condition:
          switch.is_on: wake_word_listening
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
    # A conversation cut off here never reaches on_end, and the video would
    # stay quiet until the next one.
    - mixer_speaker.apply_ducking:
        id: portall_mixing_input
        decibel_reduction: 0
        duration: 1s
  on_end:
    # Let the answer finish before listening again, or the wake word hears
    # the panel's own voice.
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        not:
          media_player.is_announcing:
    # The answer is over: the video comes back up, over a second rather than
    # at once.
    - mixer_speaker.apply_ducking:
        id: portall_mixing_input
        decibel_reduction: 0
        duration: 1s
    - if:
        condition:
          switch.is_on: wake_word_listening
        then:
          - micro_wake_word.start:


    
switch:
  - platform: gpio
    pin: GPIO20 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF 

  - platform: portall_bt
    name: "Bluetooth"
    id: bt_enabled
    icon: mdi:bluetooth
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Ecoute du mot de reveil"
    id: wake_word_listening
    icon: mdi:microphone
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - micro_wake_word.start:
    on_turn_off:
      - micro_wake_word.stop:  
    
binary_sensor:
  - platform: template
    name: "En charge"
    lambda: |-
      if (id(battery_voltage).state > 2.45) {
        return true;
      } else {
        return false;
      }

sensor:
  - platform: adc
    pin: GPIO52
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    update_interval: 300s
    attenuation: 12db # Scales the ESP32 ADC range to read up to ~3.6V safely
    filters:
      - multiply: 1.73 # Example multiplier to scale the divided voltage back to 
        
  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - calibrate_linear:
          - 3.2 -> 0.0
          - 4.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
          


  #- platform: wifi_signal
    #name: "WiFi Signal"
    #update_interval: 600s
    #unit_of_measurement: "dBm"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    update_interval: 600s


  - platform: template
    name: "SRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "KB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 600s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
      return (total - heap_caps_get_free_size(MALLOC_CAP_INTERNAL)) / 1024.0;

  - platform: template
    name: "PSRAM Usage"
    icon: mdi:memory
    unit_of_measurement: "MB"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 600s
    lambda: |-
      const size_t total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
      if (total == 0)
        return 0.0;
      return (total - heap_caps_get_free_size(MALLOC_CAP_SPIRAM)) / (1024.0 * 1024.0);
      
text_sensor:
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker"
      icon: mdi:speaker-bluetooth
    input:
      name: "Bluetooth controller"
      icon: mdi:controller

  # One row per device: up to four speakers remembered (ONE plays at a time,
  # the others read "not in use") and four controllers or remotes. An empty
  # row reads "none". The Use and Forget buttons below act on the same row.
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker 1"
      icon: mdi:speaker-bluetooth
      slot: 1
    input:
      name: "Bluetooth controller 1"
      icon: mdi:controller
      slot: 1
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker 2"
      icon: mdi:speaker-bluetooth
      slot: 2
    input:
      name: "Bluetooth controller 2"
      icon: mdi:controller
      slot: 2
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker 3"
      icon: mdi:speaker-bluetooth
      slot: 3
    input:
      name: "Bluetooth controller 3"
      icon: mdi:controller
      slot: 3
  - platform: portall_bt
    speaker:
      name: "Bluetooth speaker 4"
      icon: mdi:speaker-bluetooth
      slot: 4
    input:
      name: "Bluetooth controller 4"
      icon: mdi:controller
      slot: 4

    
      
            
number:
  - platform: template
    name: "Volume"
    id: panel_volume
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      then:
        - portall.set_volume:
            volume: !lambda 'return x / 100.0;'

    
  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: Veille de l ecran
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 0
    mode: slider
    unit_of_measurement: s
    icon: mdi:television-off
    on_value:
      - lambda: 'id(screen_off_delay) = (int) x;'
      - script.execute: screen_timeout

script:
  - id: screen_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off_delay) > 0;'
          then:
            - delay: !lambda 'return id(screen_off_delay) * 1000;'
            - light.turn_off: backlight
            #- usb_display.wake: udisp              
    

globals:
  - id: screen_off_delay
    type: int
    restore_value: yes
    initial_value: '0'


output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - portall.wake:
    on_turn_off:
      - portall.sleep:
          
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      - light.turn_on: backlight
      - script.execute: screen_timeout
      - portall.wake:     

        
      
    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_screen
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false




portall:
  display_id: main_screen
  touchscreen_id: my_touch
  port: 5000
  width: 800
  height: 1280
  max_fps: 60
  jpeg_quality: 9
  rotation: 0
  usb: false
  #remote: true
  max_frame_bytes: 400000
  speaker_id: portall_mixing_input #portall_resampler #portall_mixing_input
  sample_rate: 44100
  #on_audio_start:
    #- switch.turn_on: audio_amplifier

portall_bt:
  id: dongle
  host_stack: bluedroid
  audio: true
  test_tone: 0
  hid: true
  keys: true 
  #show_reports: true


  device_name: "Guition"

  on_media_key:
    - lambda: |-
        // The car receiver's steering wheel, or the button on an earcup.
        ESP_LOGI("panel", "button %02x %s", code, pressed ? "down" : "up");

  on_media_volume:
    - lambda: |-
        // A fraction, because AVRCP carries 0..127 and no YAML should have to
        // know that. Sent straight at the one volume this board has.
        id(panel_volume).make_call().set_value(volume * 100.0f).perform();

       

button:

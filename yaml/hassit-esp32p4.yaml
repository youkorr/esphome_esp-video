substitutions:
  name: ha-guit-10-p4


esphome:
  name: ha-guit-10-p4
  friendly_name: HA-GUIT-10-P4



esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    components:
      - espressif/esp_hosted==3.0.9  
    sdkconfig_options:
      CONFIG_ESP_HOSTED_HOST_SDIO_RX_Q_SIZE: "64"
      CONFIG_ESP_HOSTED_HOST_SDIO_RX_STAGING_SLOTS: "4"
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_TX_BA_WIN: "32"
      CONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_RX_BA_WIN: "32"
      CONFIG_LWIP_TCP_SACK_OUT: "y"
  
      
logger:
  level: DEBUG
  #logs:
    #esp-idf: WARN   



api:
  encryption:
    key: ""

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  post_connect_roaming: false
  ap:
    ssid: HA_ESP32P4 Fallback Hotspot
    password: ""

captive_portal:
  
esp32_hosted:
  variant: ESP32C6
  active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17 
  use_psram: false

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - voltage: 2.5V
    channel: 4
    
psram:
  speed: 200MHz
  ignore_not_found: false
    
external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
    components: [portall, portall_bt]
    refresh: 0s

  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]


  - source: github://jtenniswood/esphome-media-player@main
    components: [ gsl3680 ]
    refresh: 0s
 
  - source: github://pr#19621
    components: [esp32_hosted]

http_request:
  
#update:
  #- platform: esp32_hosted
    #id: c6_firmware_update
    #name: "ESP32-C6 Firmware"
    #type: http
    #source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json

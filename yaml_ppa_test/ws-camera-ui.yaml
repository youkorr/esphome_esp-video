esphome:
  name: ws-camera-ui
  friendly_name: Waveshare camera UI
  on_boot:
    # After LVGL has built its widgets.
    priority: -100
    then:
      - lambda: |-
          // The wallpaper's lights drift back and forth on their own, each on
          // its own period so they never line up. LVGL runs these; nothing
          // here is called again.
          auto drift = [](lv_obj_t *obj, int32_t from, int32_t to, uint32_t ms, bool vertical) {
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, obj);
            lv_anim_set_values(&a, from, to);
            lv_anim_set_duration(&a, ms);
            lv_anim_set_reverse_duration(&a, ms);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
            if (vertical) {
              lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_obj_set_y((lv_obj_t *) o, v); });
            } else {
              lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_obj_set_x((lv_obj_t *) o, v); });
            }
            lv_anim_start(&a);
          };
          drift(id(light_a), -96, 416, 23000, false);
          drift(id(light_a), -64, 216, 17000, true);
          drift(id(light_b), 720, 336, 29000, false);
          drift(id(light_b), 250, -48, 19000, true);
          drift(id(light_c), 208, 608, 31000, false);
          drift(id(light_c), 350, 134, 13000, true);
      - script.execute: update_clock

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

logger:
  level: DEBUG
  logs:
    esp-idf: WARN
    esp_video_camera: DEBUG 

api:
  encryption:
    key: "b6bgvC04gTOsEvAsLKP9GtIi61vzLLy5HCbVYpNbQFg="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ws-camera-ui Fallback Hotspot
    password: "ic51qqMaFPT4"

captive_portal:

    
http_request:
  
update:
  - platform: esp32_hosted
    id: c6_firmware_update
    name: "ESP32-C6 Firmware"
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h
    
psram:
  mode: hex
  speed: 200MHz

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome
      ref: esp_video_camera-lvgl
    components: [lvgl_camera_display, esp_video_camera]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl, mipi_dsi]
    refresh: 0s
  - source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho]
    refresh: 0s
    
  

esp32_hosted:
  variant: esp32c6
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  use_psram: true
  slot: 1

esp_ldo:
  - voltage: 2.5V
    channel: 3


i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

display:
  - platform: mipi_dsi
    id: panel
    # Its reset pin (33), timings and EK79007 init are in the model.
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    pixel_mode: 16
    framebuffers: 3      # LVGL draws into the panel's own buffers

# The touch, as in the household's working configurations for this board
# (esphome_esp-video's ws-wired-portall.yaml, ws-usb-screen.yaml and
# lvgl-kawaii.yaml): read every 20 ms with no interrupt, and both axes
# mirrored. On this board the GT911 counts from the corner opposite the
# panel's first pixel; mirroring both brings a touch to the panel's own
# coordinates, and LVGL then turns it by the screen's rotation, as it turns
# everything it draws through lvgl_ortho.
#
# NOT run on a board with lvgl_ortho as it is now (it used to turn a touch a
# second time, which at 180 undid LVGL's own turn). If a touch lands on the
# opposite corner -- pressing bottom right does what top left should -- take
# the three transform: lines out.
touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 20ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO32
    frequency: 1000Hz
    inverted: true

# ---- The camera (as in camera-test-ws.yaml) ----------------------------------
esp_video_camera:
  id: ws_cam
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  device: jpeg
  sensor_model: ov5647
  resolution: 800x640 #1280x960
  jpeg_quality: 15
  max_framerate: 50

lvgl_camera_display:
  id: camera_display
  camera_id: ws_cam
  canvas_id: camera_canvas
  # Off until the button is pressed: no frame is asked of the camera while
  # home is shown.
  #enabled: false
  # The camera is taken from the main loop: keep it awake while it is shown
  # (27.8 frames a second on this board with it, 20 without).
  fast_loop: true

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

script:
  # The back button over the video goes away after a few seconds, as a video
  # player's controls do. Shown, it costs every frame: LVGL redraws it over
  # each new picture, reading back what is under it -- on a Tab5, 17.9 frames
  # a second with the button against 20.3 for the camera alone. A touch on
  # the picture brings it back.
  - id: hide_back_button
    mode: restart
    then:
      - delay: 4s
      - lvgl.widget.hide: back_button

  # The clock, the date and the wallpaper's colours. Run once a minute: a
  # label rewritten every second would redraw it every second for nothing.
  - id: update_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid())
            return;
          static const char *const DAYS[] = {"dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi",
                                             "samedi"};
          static const char *const MONTHS[] = {"janvier", "février", "mars", "avril", "mai", "juin", "juillet",
                                               "août", "septembre", "octobre", "novembre", "décembre"};
          char buf[64];
          snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
          lv_label_set_text(id(clock_label), buf);
          snprintf(buf, sizeof(buf), "%s %d %s", DAYS[now.day_of_week - 1], now.day_of_month,
                   MONTHS[now.month - 1]);
          lv_label_set_text(id(date_label), buf);
          // The sky behind the lights follows the hour: dawn, day, dusk, night.
          // Changed only when the hour band changes, since it redraws the screen.
          static int last_band = -1;
          const int h = now.hour;
          const int band = h < 6 ? 3 : h < 10 ? 0 : h < 17 ? 1 : h < 21 ? 2 : 3;
          if (band == last_band)
            return;
          last_band = band;
          static const uint32_t TOP[] = {0x2B2F77, 0x1565C0, 0x4A1F5C, 0x070B1F};
          static const uint32_t BOTTOM[] = {0xF2994A, 0x4FC3F7, 0xF2709C, 0x1B2A49};
          lv_obj_t *page = id(home_page)->obj;
          lv_obj_set_style_bg_color(page, lv_color_hex(TOP[band]), 0);
          lv_obj_set_style_bg_grad_color(page, lv_color_hex(BOTTOM[band]), 0);

font:
  # "-" for the "--:--" shown until Home Assistant has given the time.
  - file: "gfonts://Montserrat@300"
    id: font_clock
    size: 112
    glyphs: "0123456789:-"
  - file: "gfonts://Montserrat@500"
    id: font_date
    size: 26
    glyphsets: [GF_Latin_Kernel]
  - file: "gfonts://Montserrat@600"
    id: font_button
    size: 28
    glyphsets: [GF_Latin_Kernel]

lvgl_ortho:
  id: ortho
  rotation: 180          # the 7B turned over (ESPHome's degrees)
  ppa: true
  cores: 2
  split: false

lvgl:
  displays:
    - panel
  touchscreens:
    - touch_screen
  # no rotation: here; lvgl_ortho turns the screen, and LVGL the touches
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  # false beside lvgl_ortho: with them on, the PPA stalled on a Tab5
  use_ppa: false
  use_ppa_img: false
  fps_benchmark: true
  perf_monitor: true
  pages:
    # ---- Home ----------------------------------------------------------------
    - id: home_page
      bg_color: 0x1565C0
      bg_grad_color: 0x4FC3F7
      bg_grad_dir: VER
      scrollable: false
      widgets:
        # The wallpaper's three lights: large soft circles, half see-through,
        # moved by the animations started on boot.
        - obj:
            id: light_a
            x: -96
            y: -64
            width: 416
            height: 416
            radius: 208
            bg_color: 0x7C4DFF
            bg_opa: 35%
            border_width: 0
            clickable: false
            scrollable: false
        - obj:
            id: light_b
            x: 720
            y: 250
            width: 368
            height: 368
            radius: 184
            bg_color: 0x00E5FF
            bg_opa: 30%
            border_width: 0
            clickable: false
            scrollable: false
        - obj:
            id: light_c
            x: 208
            y: 350
            width: 320
            height: 320
            radius: 160
            bg_color: 0xFF4081
            bg_opa: 25%
            border_width: 0
            clickable: false
            scrollable: false

        # Clock and date, top left.
        - label:
            id: clock_label
            x: 56
            y: 48
            text: "--:--"
            text_font: font_clock
            text_color: 0xFFFFFF
        - label:
            id: date_label
            x: 62
            y: 188
            text: ""
            text_font: font_date
            text_color: 0xFFFFFF
            text_opa: 85%

        # The camera button: a frosted card, bottom right.
        - button:
            id: camera_button
            x: 656
            y: 364
            width: 304
            height: 176
            radius: 30
            bg_color: 0xFFFFFF
            bg_opa: 22%
            border_width: 2
            border_color: 0xFFFFFF
            border_opa: 45%
            shadow_width: 0
            pressed:
              bg_opa: 40%
              transform_width: -5
              transform_height: -5
            widgets:
              - label:
                  align: TOP_MID
                  y: 28
                  text: "\uF008"       # LV_SYMBOL_VIDEO
                  text_font: montserrat_40
                  text_color: 0xFFFFFF
              - label:
                  align: BOTTOM_MID
                  y: -28
                  text: "Camera"
                  text_font: font_button
                  text_color: 0xFFFFFF
            on_click:
              - lvgl_camera_display.start: camera_display
              - lvgl.page.show: camera_page
              - lvgl.widget.show: back_button
              - script.execute: hide_back_button

    # ---- Camera --------------------------------------------------------------
    - id: camera_page
      bg_color: 0x87CEEB
      scrollable: false
      widgets:
        # The sensor's 1280x960 frame is larger than the screen: its middle
        # 1024x600 shows, as in camera-test-ws.yaml.
        - canvas:
            id: camera_canvas
            x: 120
            y: 0
            width: 800 #1024
            height: 600
            # A touch on the picture shows the back button again.
            clickable: true
            on_press:
              - lvgl.widget.show: back_button
              - script.execute: hide_back_button
        # Small, and hidden after a few seconds (hide_back_button).
        - button:
            id: back_button
            x: 22
            y: 22
            width: 72
            height: 72
            radius: 36
            bg_color: 0x000000
            bg_opa: 45%
            border_width: 2
            border_color: 0xFFFFFF
            border_opa: 60%
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\uF053"       # LV_SYMBOL_LEFT
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_click:
              - lvgl.page.show: home_page
              - lvgl_camera_display.stop: camera_display
                
    

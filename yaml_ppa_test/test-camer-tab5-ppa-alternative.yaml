    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON


# ---- The camera (as in habbit (1).yaml) ------------------------------------
esp_video_camera:
  id: video_camera
  name: Camera
  i2c_id: bsp_bus
  device: jpeg
  sensor_model: sc2356
  resolution: 1280x720
  jpeg_quality: 15
  max_framerate: 30

display:
  - platform: mipi_dsi
    id: main_display
    pixel_mode: 16
    dimensions:
      height: 1280
      width: 720
    model: M5Stack-Tab5
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    framebuffers: 3      # was 1: LVGL draws into the panel's own buffers
    color_order: rgb
# The whole landscape screen is the camera's window.
lvgl:
  displays:
    - main_display
  # no rotation: and no rotation_buffers_internal: lvgl_ortho turns
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  # false beside lvgl_ortho: with them on, the PPA stalled on a Tab5
  use_ppa: false
  use_ppa_img: false
  fps_benchmark: true
  perf_monitor: true
  pages:
    - id: camera_page
      widgets:
        - canvas:
            id: camera_canvas
            width: 1280
            height: 720

lvgl_camera_display:
  camera_id: video_camera
  canvas_id: camera_canvas
  fast_loop: true

# ---- The board: M5Stack Tab5 (as in tab5-test-lvgl.yaml) --------------------


psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  variant: esp32c6
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  slot: 1

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

switch:

  - platform: gpio
    id: camera_reset
    name: Camera reset
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 6
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON
    inverted: False

  - platform: gpio
    id: wifi_antenna_int_ext
    internal: True
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0

  - platform: gpio
    id: usb_5v_power
    name: USB-A Power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON      


  - platform: gpio
    id: interrupt_pin_toushsreen
    name: "interrupt_pin_toushscreen"
    pin:
      inverted: true
      number: GPIO23
    restore_mode: ALWAYS_ON  



output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz
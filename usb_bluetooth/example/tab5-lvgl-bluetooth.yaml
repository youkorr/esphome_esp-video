button:
  - platform: template
    name: Pair a Bluetooth device
    on_press:
      - usb_bluetooth.pair: dongle
  - platform: template
    name: Forget Bluetooth speaker
    entity_category: config
    on_press:
      - usb_bluetooth.forget_speaker: dongle
  - platform: template
    name: Forget Bluetooth remotes and controllers
    entity_category: config
    on_press:
      - usb_bluetooth.forget_input: dongle

# ---------------------------------------------------------------- sound
# A2DP carries 44100 Hz 16-bit stereo, so the mixer and both pipelines run at
# 44100 and nothing on the board resamples: Home Assistant converts before it
# sends. A mono source is written to both sides by the Bluetooth speaker.
speaker:
  - platform: usb_bluetooth
    id: bt_speaker
    usb_bluetooth_id: dongle

  - platform: mixer
    id: mixing_speaker
    output_speaker: bt_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

media_player:
  - platform: speaker
    name: Tab5
    id: speaker_player
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcement_mixing_input
      format: FLAC
      sample_rate: 44100
      num_channels: 1
    media_pipeline:
      speaker: media_mixing_input
      format: FLAC
      sample_rate: 44100
      num_channels: 1

# ---------------------------------------------------------------- keys
# One binary sensor per LVGL key. On an LVGL keypad only `next` and `prev`
# move the focus -- the arrows go to the focused widget -- so the remote's
# Down and Right both mean next, and Up and Left both mean previous.
binary_sensor:
  - platform: usb_bluetooth
    id: bt_next
    key: [down, right]
  - platform: usb_bluetooth
    id: bt_prev
    key: [up, left]
  - platform: usb_bluetooth
    id: bt_enter
    key: enter
  - platform: usb_bluetooth
    id: bt_esc
    key: esc
  # A remote's Menu and a gamepad's Home. Not an LVGL key here: it brings the
  # first page back, which is what a Home button is for.
  - platform: usb_bluetooth
    id: bt_home
    key: home
    on_press:
      - lvgl.page.show: home_page

# ---------------------------------------------------------------- screen
display:
  - platform: mipi_dsi
    id: main_screen
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: bsp_bus
    update_interval: 16ms
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

lvgl:
  displays: main_screen
  touchscreens: touch_screen
  color_depth: 16
  buffer_size: 25%
  keypads:
    - next: bt_next
      prev: bt_prev
      enter: bt_enter
      esc: bt_esc
  # Where the remote is, drawn on every button: a thick white outline on the
  # one that has the keypad's focus.
  theme:
    button:
      bg_color: 0x2b3342
      radius: 16
      text_color: 0xe6e9ef
      focus_key:
        border_width: 4
        border_color: 0xffffff
  # Each page is ONE column centred on the screen, with scrolling off, so it
  # holds together in portrait (720x1280) and landscape (1280x720) alike.
  # Widgets placed at fixed offsets from the centre ran off a landscape screen
  # and LVGL grew a scroll bar down its right edge. flex_align_track: center
  # is what centres the column itself: without it LVGL puts the column at the
  # left and only centres things inside it.
  pages:
    - id: home_page
      bg_color: 0x10141c
      scrollable: false
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 28
      widgets:
        - label:
            id: status
            margin_bottom: 12
            text: "Press a button, or pair a remote"
            text_color: 0xe6e9ef
            text_font: montserrat_28
        # Living room and Kitchen do nothing but say they were pressed: they
        # are there to try the remote -- Down/Right and Up/Left move the white
        # outline between them, OK presses the one it is on.
        - button:
            id: btn_living
            width: 480
            height: 96
            widgets:
              - label:
                  align: CENTER
                  text: "Living room"
                  text_font: montserrat_28
            on_click:
              - lvgl.label.update:
                  id: status
                  text: "Living room"
        - button:
            id: btn_kitchen
            width: 480
            height: 96
            widgets:
              - label:
                  align: CENTER
                  text: "Kitchen"
                  text_font: montserrat_28
            on_click:
              - lvgl.label.update:
                  id: status
                  text: "Kitchen"
        - button:
            id: btn_music
            width: 480
            height: 96
            widgets:
              - label:
                  align: CENTER
                  text: "Test sound"
                  text_font: montserrat_28
            on_click:
              - lvgl.label.update:
                  id: status
                  text: "Playing a test sound"
              # Home Assistant plays it rather than the board fetching it:
              # it converts whatever the file is (an MP3 included) into the
              # FLAC at 44100 Hz the pipelines above ask for. Played by the
              # board itself, only FLAC is decoded and only a 44100 Hz file
              # would be accepted by the mixer. Needs "Allow the device to
              # perform Home Assistant actions" ticked on this device in
              # Home Assistant's ESPHome integration, which is off by default.
              - homeassistant.action:
                  action: media_player.play_media
                  data:
                    entity_id: ${player_entity}
                    media_content_id: ${test_sound}
                    media_content_type: music
        - button:
            id: btn_settings
            width: 480
            height: 96
            widgets:
              - label:
                  align: CENTER
                  text: "Settings"
                  text_font: montserrat_28
            on_click:
              - lvgl.page.show: settings_page

    # What is paired, one row per device. Speakers: several are remembered
    # and ONE plays -- Use switches to another, Forget removes one. Remotes
    # and controllers: up to four at once. Side by side on a landscape screen,
    # one above the other in portrait.
    - id: settings_page
      bg_color: 0x10141c
      scrollable: false
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
        flex_align_track: center
        pad_row: 14
      widgets:
        - label:
            text: "Bluetooth"
            text_color: 0xe6e9ef
            text_font: montserrat_28
        - obj:
            width: 100%
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: center
              flex_align_cross: start
              flex_align_track: center
              pad_row: 16
              pad_column: 24
            widgets:
            - obj:
                width: 600
                height: SIZE_CONTENT
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                layout:
                  type: flex
                  flex_flow: column
                  flex_align_cross: center
                  pad_row: 8
                widgets:
                  - label:
                      text: "Speakers -- one plays at a time"
                      text_color: 0x8a94a6
                      text_font: montserrat_20
                  - label:

# usb_bluetooth on an M5Stack Tab5, with ESPHome's own LVGL and nothing else.
#
# A USB Bluetooth dongle in the Tab5's USB-A socket gives this board
# Bluetooth CLASSIC, which the ESP32-C6 beside the P4 does not have:
#   - a Bluetooth speaker, headphones or a car receiver play the media
#     player's sound (A2DP);
#   - a remote, a keyboard or a gamepad moves LVGL's focus and presses the
#     focused button, through `lvgl: keypads:` (HID, and AVRCP buttons).
#
# Pairing: press "Pair a Bluetooth device" in Home Assistant with the device
# in pairing mode. It is remembered, and reconnected by address after a
# restart without scanning again. The Wi-Fi drops for the ten seconds a scan
# lasts -- a Bluetooth inquiry sweeps the whole 2.4 GHz band.
#
# Dongles proved: Broadcom BCM20702A1 (Bluetooth 4.0, no firmware needed) and
# TP-Link UB500 (Realtek RTL8761BU, whose firmware is built in by the
# component -- nothing to download).
#
# This file is checked with `esphome config` and the codegen on ESPHome
# 2026.10.0-dev. Flashed on a Tab5: pairing, the speaker and the remote work.
# The one-column layout of the pages came after that and has not been flashed.

substitutions:
  # The media player below as Home Assistant names it: Settings > Devices &
  # services > ESPHome > this board. Home Assistant builds it from the
  # friendly name and the player's name, so this is it unless one was renamed.
  player_entity: media_player.tab5_bluetooth_tab5
  # Any address Home Assistant can fetch -- MP3, FLAC, WAV, OGG...
  test_sound: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac"

esphome:
  name: tab5-bluetooth
  friendly_name: Tab5 Bluetooth

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      ref: main
      path: usb_bluetooth/components
    components: [usb_bluetooth]
    refresh: 1d

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
  - id: pi4ioe2
    address: 0x44

switch:
  - platform: gpio
    id: wifi_power
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  # The USB-A socket's 5 V. A USB host supplies the power, and on the Tab5 it
  # is this expander pin: without it nothing enumerates.
  - platform: gpio
    id: usb_5v_power
    name: USB-A power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON

  # Bluetooth off hangs up both profiles and stops reconnecting.
  - platform: usb_bluetooth
    name: Bluetooth
    icon: mdi:bluetooth
    restore_mode: RESTORE_DEFAULT_ON

usb_bluetooth:
  id: dongle
  # The Tab5's USB-A socket is on the high-speed OTG peripheral, which is the
  # default. Nothing else in this file may use it (no usb_host, no tinyusb).
  controller: high_speed
  host_stack: bluedroid
  audio: true
  hid: true
  device_name: Tab5

text_sensor:
  # For Home Assistant: the speaker playing, and every remote or controller
  # on one line. On the screen they say whether a section reads "None paired".
  - platform: usb_bluetooth
    speaker:
      name: Bluetooth speaker
      icon: mdi:speaker-bluetooth
      update_interval: 1s
      on_value:
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.show: lbl_no_speakers
            else:
              - lvgl.widget.hide: lbl_no_speakers
    input:
      name: Bluetooth remotes and controllers
      icon: mdi:remote
      update_interval: 1s
      on_value:
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.show: lbl_no_inputs
            else:
              - lvgl.widget.hide: lbl_no_inputs
  # For the screen: ONE row per remembered speaker and per input slot, 1 to 4
  # each, with its own buttons. Internal, because a slot means nothing on a
  # Home Assistant card -- here the row shows which device sits in it. A row
  # hides itself when its slot is empty, and a speaker's Use button shows only
  # on the ones not playing. Polled every second so a change shows at once.
  - platform: usb_bluetooth
    speaker:
      id: bt_speaker_1
      internal: true
      slot: 1
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_speaker_1
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_speaker_1
            else:
              - lvgl.widget.show: row_speaker_1
        - if:
            condition:
              lambda: 'return x.find("not in use") != std::string::npos;'
            then:
              - lvgl.widget.show: btn_use_speaker_1
            else:
              - lvgl.widget.hide: btn_use_speaker_1
  - platform: usb_bluetooth
    speaker:
      id: bt_speaker_2
      internal: true
      slot: 2
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_speaker_2
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_speaker_2
            else:
              - lvgl.widget.show: row_speaker_2
        - if:
            condition:
              lambda: 'return x.find("not in use") != std::string::npos;'
            then:
              - lvgl.widget.show: btn_use_speaker_2
            else:
              - lvgl.widget.hide: btn_use_speaker_2
  - platform: usb_bluetooth
    speaker:
      id: bt_speaker_3
      internal: true
      slot: 3
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_speaker_3
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_speaker_3
            else:
              - lvgl.widget.show: row_speaker_3
        - if:
            condition:
              lambda: 'return x.find("not in use") != std::string::npos;'
            then:
              - lvgl.widget.show: btn_use_speaker_3
            else:
              - lvgl.widget.hide: btn_use_speaker_3
  - platform: usb_bluetooth
    speaker:
      id: bt_speaker_4
      internal: true
      slot: 4
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_speaker_4
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_speaker_4
            else:
              - lvgl.widget.show: row_speaker_4
        - if:
            condition:
              lambda: 'return x.find("not in use") != std::string::npos;'
            then:
              - lvgl.widget.show: btn_use_speaker_4
            else:
              - lvgl.widget.hide: btn_use_speaker_4
  - platform: usb_bluetooth
    input:
      id: bt_input_1
      internal: true
      slot: 1
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_input_1
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_input_1
            else:
              - lvgl.widget.show: row_input_1
  - platform: usb_bluetooth
    input:
      id: bt_input_2
      internal: true
      slot: 2
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_input_2
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_input_2
            else:
              - lvgl.widget.show: row_input_2
  - platform: usb_bluetooth
    input:
      id: bt_input_3
      internal: true
      slot: 3
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_input_3
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_input_3
            else:
              - lvgl.widget.show: row_input_3
  - platform: usb_bluetooth
    input:
      id: bt_input_4
      internal: true
      slot: 4
      update_interval: 1s
      on_value:
        - lvgl.label.update:
            id: lbl_input_4
            text: !lambda return x;
        - if:
            condition:
              lambda: 'return x == "none";'
            then:
              - lvgl.widget.hide: row_input_4
            else:

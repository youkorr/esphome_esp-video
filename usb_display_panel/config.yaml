name: ESP32-P4 Panel
version: "1.18.0"
slug: usb_display_panel
description: Renders Home Assistant dashboards onto ESPHome usb_display panels over the network, with touch coming back
url: https://github.com/youkorr/esphome_esp-video
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
options:
  # Set once here and every panel inherits it. A panel may still override any
  # of these for itself.
  # Only Home Assistant needs one. A panel pointed at any other page should
  # leave this empty: the sender then writes nothing into the page's storage
  # and waits for no dashboard, and renders it just the same.
  token: ""
  # The page to render. For Home Assistant, this is the name it answers to from
  # inside an add-on -- use it rather than a remote-access address, because
  # Tailscale, Nabu Casa and dynamic DNS names are for reaching the house from
  # outside and do not resolve in here. Any other site is given by its own
  # address, and needs no token.
  url: http://homeassistant:8123/lovelace/0
  port: 5000
  # The upper bound on how often a change is acted on. It only bounds pictures
  # nobody asked for: a press lifts it to fifteen a second for the second that
  # follows, which is what a dashboard transition needs, so a low number here
  # no longer makes the panel feel slow. Lower it to 4 if the machine running
  # this has other work to do; a still dashboard costs nothing whatever it is
  # set to. It was 30, which left the browser painting at its own full rate.
  fps: 10
  quality: 80
  # What the browser hands over, before it is cut into rectangles. Asking it
  # for lossless PNG instead -- 0 -- costs the machine running this about
  # eight times the CPU for a picture the panel cannot tell apart.
  capture_quality: 90
  # What one rectangle costs the board, as a fraction of redrawing the whole
  # panel. Left empty it is worked out from each panel's size, which is right
  # for every panel this has been measured on. Raise it towards 0.18 only if
  # the board's log starts reporting dropped frames.
  rect_cost: ""
  # Hold the page's animations still. Only animations: a camera, a video and a
  # card that paints itself on a canvas carry on regardless, and one of those
  # on the dashboard makes this worth nothing. Try it and watch the log.
  freeze_animations: false
  stats: true
  panels:
    - name: salon
      host: ip_esp32P4
      width: 1024
      height: 600
      rotate: "180"
      touch_rotate: "180"
      # Draw smaller and let the board's accelerator scale up. Must match the
      # component's render_width/render_height exactly. Measured on an
      # 800x1280 panel with 640x1024 here: 3.3 ms of work per picture instead
      # of 8.7, and 13 KiB instead of 18. Leave both out for no scaling.
      render_width: 0
      render_height: 0
      touch_mirror_x: false
      touch_mirror_y: false
schema:
  token: password
  url: str?
  port: port?
  fps: float?
  quality: int(1,95)?
  capture_quality: int(0,100)?
  rect_cost: str?
  freeze_animations: bool?
  stats: bool?
  panels:
    - name: str
      host: str
      port: port?
      url: str?
      token: password?
      width: int(16,4096)
      height: int(16,4096)
      rotate: list(0|90|180|270)
      touch_rotate: list(0|90|180|270)
      render_width: int(0,4096)?
      render_height: int(0,4096)?
      touch_mirror_x: bool?
      touch_mirror_y: bool?
      fps: float?
      quality: int(1,95)?
      capture_quality: int(0,100)?
      rect_cost: str?
      freeze_animations: bool?
      stats: bool?

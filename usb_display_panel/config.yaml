name: ESP32-P4 Panel
version: "1.9.0"
slug: usb_display_panel
description: Renders Home Assistant dashboards onto ESPHome usb_display panels over the network, with touch coming back
url: https://github.com/youkorr/esphome_esp-video
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
options:
  # Set once here and every panel inherits it. A panel may still override any
  # of these for itself.
  token: ""
  # The name Home Assistant answers to from inside an add-on. Use this rather
  # than a remote-access address: Tailscale, Nabu Casa and dynamic DNS names
  # are for reaching the house from outside and do not resolve in here.
  url: http://homeassistant:8123/lovelace/0
  port: 5000
  fps: 30
  quality: 80
  stats: true
  # A panel has no keys. This draws one in the page when a field is focused;
  # it has a key to switch layout and remembers the choice, so this only
  # decides which one it starts on.
  keyboard: true
  keyboard_layout: azerty
  panels:
    - name: salon
      host: ip_esp32P4
      width: 1024
      height: 600
      rotate: "180"
      touch_rotate: "180"
      touch_mirror_x: false
      touch_mirror_y: false
schema:
  token: password
  url: str?
  port: port?
  fps: float?
  quality: int(1,95)?
  stats: bool?
  keyboard: bool?
  keyboard_layout: list(azerty|qwerty)?
  panels:
    - name: str
      host: str
      port: port?
      url: str?
      token: password?
      width: int(16,4096)
      height: int(16,4096)
      rotate: list(0|90|180|270)
      touch_rotate: list(0|90|180|270)
      touch_mirror_x: bool?
      touch_mirror_y: bool?
      fps: float?
      quality: int(1,95)?
      stats: bool?
      keyboard: bool?
      keyboard_layout: list(azerty|qwerty)?

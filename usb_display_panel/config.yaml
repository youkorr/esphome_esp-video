name: ESP32-P4 Panel
version: "1.55.0"
slug: usb_display_panel
description: Renders Home Assistant dashboards onto ESPHome portall panels over the network, with touch coming back
url: https://github.com/youkorr/esphome_esp-video
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
options:
  # Set once here and every panel inherits it. A panel may still override any
  # of these for itself.
  # Only Home Assistant needs one. A panel pointed at any other page should
  # leave this empty: the sender then writes nothing into the page's storage
  # and waits for no dashboard, and renders it just the same.
  token: ""
  # The page to render. For Home Assistant, this is the name it answers to from
  # inside an add-on -- use it rather than a remote-access address, because
  # Tailscale, Nabu Casa and dynamic DNS names are for reaching the house from
  # outside and do not resolve in here. Any other site is given by its own
  # address, and needs no token.
  url: http://homeassistant:8123/lovelace/0
  port: 5000
  # The upper bound on how often a change is acted on, and the one setting that
  # decides whether video looks like video.
  #
  # It was 10, on the reasoning that a touch lifts it to thirty for two seconds
  # anyway. That is true and it is beside the point for anything you WATCH:
  # nobody touches the panel while a film plays, so the window closes and the
  # picture falls back to this number. Measured on a page moving continuously
  # with no finger on it: 9.5 pictures a second at 10, 17.8 at 20, 25.3 at 30.
  #
  # A still dashboard costs nothing whatever this is set to -- what is not
  # changing is not sent. It only bites when something moves, so the cost is
  # a camera tile or a video, which is exactly where the smoothness is wanted.
  # Lower it to 10 or 4 if the machine running this has other work to do, or if
  # a panel of yours only ever shows a dashboard.
  fps: 25
  quality: 80
  # The on-screen keyboard, drawn by the browser whenever a text field takes
  # focus -- the dashboard's search, Assist, the search box of an ordinary
  # site. A panel has no keys, so without it those are dead ends. It takes no
  # room when nothing is waiting for text. Set it to the layout you want the
  # letters in, or off to leave it out.
  keyboard: qwerty
  # How long a panel has to have been dark before its page is let go of.
  # Stopping the picture does not stop the page: it goes on painting and
  # running its timers for a screen nobody can see, and measured on a
  # container, a sleeping panel still cost 1.1 seconds of CPU every ten. Past
  # this delay the page is parked and that falls to 0.15. It is loaded again
  # when the panel wakes, which takes about three seconds -- three seconds
  # showing the dashboard as it was, not a black screen, because the board
  # still holds the last picture it was sent. Short sleeps never reach the
  # delay and stay instant. 0 leaves the page running.
  blank_after: 300
  # Keep the browser's profile between restarts, one directory per panel under
  # the add-on's own storage. Without it every restart is a first visit: a site
  # signed into is signed out again, and a consent banner comes back. With it,
  # sign in once from the panel's keyboard and it stays signed in.
  keep_profile: true
  # The page a panel comes home to, built by this add-on from the list below.
  # Put "launcher" in a panel's url and it starts here; hold the top-left
  # corner for a second from anywhere and it comes back here.
  #
  # icon is one character -- an emoji, a letter. Nothing is fetched from the
  # internet, so an icon pack that failed to load could never leave holes
  # where the labels should be.
  launcher_title: Panel
  launcher_subtitle: ""
  links: []
  stats: true
  panels:
    - name: salon
      host: ip_esp32P4
      width: 1024
      height: 600
      rotate: "180"
      touch_rotate: "180"
      # false for a panel showing something that is not Home Assistant -- a
      # train board, a weather site, a page you built yourself. The token is
      # shared across panels, so without this such a panel would inherit the
      # house's token and be treated as a dashboard. Nothing else changes:
      # the page is rendered, cut into rectangles and sent the same way, and
      # touches are replayed into it the same way.
      home_assistant: true
      touch_mirror_x: false
      touch_mirror_y: false
schema:
  token: password
  url: str?
  port: port?
  fps: float?
  quality: int(1,95)?
  keyboard: list(off|qwerty|azerty)?
  blank_after: float?
  keep_profile: bool?
  launcher_title: str?
  launcher_subtitle: str?
  links:
    - name: str
      url: str
      icon: str?
  stats: bool?
  panels:
    - name: str
      host: str
      port: port?
      url: str?
      token: password?
      width: int(16,4096)
      height: int(16,4096)
      rotate: list(0|90|180|270)
      touch_rotate: list(0|90|180|270)
      home_assistant: bool?
      touch_mirror_x: bool?
      touch_mirror_y: bool?
      fps: float?
      quality: int(1,95)?
      keyboard: list(off|qwerty|azerty)?
      blank_after: float?
      keep_profile: bool?
      stats: bool?

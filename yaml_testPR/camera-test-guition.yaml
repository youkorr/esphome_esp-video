esphome:
  name: camera-test-guition
  friendly_name: camera-test-guition

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    #version: 5.5.5
    advanced:
      enable_idf_experimental_features: yes
logger:
  level: DEBUG
  logs:
    esp-idf: WARN #DEBUG #WARN                # tout le bruit IDF d'un coup

api:
  encryption:
    key: ""

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: camera-test-gui Fallback Hotspot
    password: ""

captive_portal:

esp32_hosted:
  variant: ESP32C6
  #active_high: true
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17 
  use_psram: false

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - voltage: 2.5V
    channel: 4
    
psram:
  speed: 200MHz
  #ignore_not_found: false

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl, mipi_dsi]
  - source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho]
    refresh: 0s   # ESPHome keeps a git source for a day otherwise
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      # main: its esp_video starts the camera on ESP-IDF 5.5.6 on a P4 below v3.0
      ref: main
    components: [esp_video, esp_cam_sensor, lvgl_camera_display]
    refresh: 0s
  - source: github://kvj/esphome@jd9365_gsl3680
    refresh: 0s
    components: [jd9365]


  - source: github://jtenniswood/esphome-media-player@main
    components: [ gsl3680 ]
    refresh: 0s
    
lvgl_ortho:
  id: ortho
  rotation: 90         # the Tab5 in landscape (ESPHome's degrees)
  ppa: true
  cores: 2
  split: false

esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: false

esp_cam_sensor:
  id: ws_cam
  i2c_id: bsp_bus
  sensor_type: ov02c10 
  resolution: "1288x728"   # or "1024x600", the driver's custom format (not run here)
  pixel_format: "RGB565"
  framerate: 30
  jpeg_quality: 50
  mirror_x: false
  mirror_y: false
  rotation: 0
  crop_offset_x: 0
  # lvgl_ortho is then the only user of the PPA, as on the Tab5.
  ppa_enabled: false

lvgl_camera_display:
  id: camera_display
  camera_id: ws_cam
  canvas_id: camera_canvas
  #update_interval: 16ms
  # Keeps ESPHome's main loop awake while the camera is shown. Without it the
  # loop sleeps up to 16 ms between passes and a ready frame waits: measured
  # here, 20 frames/s at WARN against 25 when the ISP's DEBUG lines happened
  # to wake it. false to see the difference.
  fast_loop: true
  
switch:
  - platform: template
    name: "LVGL Camera Display"
    id: lvgl_display_enable_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);  
          if (lvgl_disp != nullptr) {
            lvgl_disp->set_enabled(true);
          }
    turn_off_action:
      - lambda: |-
          auto *lvgl_disp = id(camera_display);  
          if (lvgl_disp != nullptr) {
            lvgl_disp->set_enabled(false);
          } 
          
    

i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz


output:
  # Backlight LED
  - platform: ledc
    pin: GPIO23
    id: GPIO23
    frequency: 100Hz
    min_power: 0.03
    zero_means_zero: true

light:
  - platform: monochromatic
    output: GPIO23
    name: Backlight
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    
touchscreen:
  - platform: gsl3680
    id: my_touch
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 1280
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false 
    on_touch:
      - light.turn_on: backlight
        
number:
  - platform: template
    id: brightness_slider
    name: "Luminosité Écran"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
            else:
              - light.turn_off:
                  id: backlight

  - platform: template
    name: "Screen Off"
    id: auto_off
    optimistic: true
    restore_value: true
    min_value: -1
    max_value: 300
    step: 1
    unit_of_measurement: s
    icon: 'mdi:television-off'
    disabled_by_default: true
    initial_value: 0
      
    
display:
  - platform: mipi_dsi
    model: JC8012P4A1
    id: main_display
    pixel_mode: 16
    update_interval: never
    auto_clear_enabled: false
    framebuffers: 3
    #reset_pin: GPIO27

lvgl:
  displays:
    - main_display
  # no rotation: and no rotation_buffers_internal: lvgl_ortho turns
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  # false beside lvgl_ortho: with them on, the PPA stalled on a Tab5
  use_ppa: false
  use_ppa_img: false
  fps_benchmark: true
  perf_monitor: true
  on_idle:
    - timeout: !lambda |-
        int timeout = id(auto_off).state;
        return (timeout == -1) ? 86400000 : (timeout * 1000);
      then:
        - lambda: |-
            static bool canvas_configured = false;
            if (!canvas_configured) {
              auto canvas = id(camera_canvas);
              if (canvas != nullptr) {
                id(camera_display).configure_canvas(canvas);
                canvas_configured = true;
                ESP_LOGI("lvgl", "Canvas configuré");
              }
            }
        
        - if:
            condition:
              lambda: 'return id(auto_off).state > 0;'
            then:
              - light.turn_off: backlight
  pages:
    - id: camera_page
      bg_color: 0x000000
      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Page caméra OV02C10 chargée");
            ESP_LOGI("camera", "Canvas: plein écran");

            // Optionnel: démarrer automatiquement le streaming
            // Décommentez les lignes ci-dessous pour auto-start:
            if (id(ws_cam).start_streaming()) {
            #//lv_label_set_text(id(camera_status_label), "LIVE");
            #//lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0x00FF00), 0);
            }
      widgets:
        - canvas:
            id: camera_canvas
            width: 1280
            height: 728
            x: 0
            y: 40
    
globals:

  - id: current_image_index
    type: int
    restore_value: true
    initial_value: '0'

  - id: alarm_panel_pending_action
    type: std::string
    restore_value: no
    initial_value: ""
  

  - id: display_timeout
    type: int
    restore_value: true
    initial_value: "2"


  - id: wifi_connection
    type: bool
    restore_value: no
    initial_value: "false"

  - id: api_connection
    type: bool
    restore_value: no
    initial_value: "false"

  - id: ota_active
    type: bool
    initial_value: 'false'


    

name: Portall
version: "4.19.3"
# Home Assistant identifies an add-on by its slug, so this one moving from
# usb_display_panel to portall makes the Supervisor see a NEW add-on: options
# are not carried over and /data starts empty, which means the browser
# profiles and everything signed into from a panel go with it.
#
# It is done once, deliberately, and now rather than later: the old name came
# from Espressif's usb_display and stopped describing this the day the picture
# started arriving over Wi-Fi. The major version says out loud that this
# release is not a drop-in update -- see "Moving from the old add-on" in the
# README for the four steps.
slug: portall
description: Home Assistant, and any web page, on an ESP32-P4 panel over Wi-Fi -- rendered here, sent as pictures, touched back
# No url:. The Supervisor turns it into "Visit the Portall page for more
# details" on the Info tab, and the only page there is to point at is the
# repository this add-on shares with an ESPHome component -- which is not what
# somebody reading about a panel wants, and was reported as exactly that. The
# Documentation tab is where the details are.
arch:
  - amd64
  - aarch64
startup: application
# The weather on the launcher is read through the Supervisor, which hands every
# add-on its own credential for exactly this. Without this line that route is
# refused, and the alternative is the household's long-lived token -- which is
# how the weather came to depend on which of two places somebody had put one.
homeassistant_api: true
# So a wallpaper can be a file somebody dropped in the obvious places, read
# only: this add-on has no business writing to any of them.
map:
  - config:ro
  - share:ro
  - media:ro
boot: auto
init: false
# The HomeKit remote needs the house's own network, and nothing else here
# does. An accessory is found over mDNS, which does not cross from the
# Supervisor's bridge to the LAN, and the iPhone has to reach its port
# directly -- which is why Home Assistant's own HomeKit works: its container
# is on the host network too.
#
# What it changes for everything else: the launcher still binds 127.0.0.1
# only, so it is the HOST's loopback now rather than a container's. Nothing
# on the LAN can reach it either way. The one thing to know is that port 8099
# must be free on the Home Assistant machine.
host_network: true
options:
  # The panels first, because they are the one thing that must be filled in
  # for anything at all to appear. Everything under them has a working
  # default.
  panels:
    - name: salon
      host: ip_esp32P4
      # launcher for the page of links this add-on builds, or an address of
      # this panel's own.
      url: launcher
      width: 1024
      height: 600
      rotate: "180"
      # All three come out of one command -- ha_send.py --calibrate -- so
      # they belong together rather than scattered among the rest.
      touch:
        rotate: "180"
        mirror_x: false
        mirror_y: false
      # Exceptions. Everything here has a default, or is inherited from
      # defaults: below, and most panels never open this at all.
      advanced:
        # false for a panel showing something that is not Home Assistant --
        # a train board, a weather site, a page you built yourself. Without
        # it such a panel inherits the tokens the links carry and is treated
        # as a dashboard.
        home_assistant: true
  links:
    - name: Home Assistant
      # From inside an add-on this is the name Home Assistant answers to. Use
      # it rather than a remote-access address: Tailscale, Nabu Casa and
      # dynamic DNS names are for reaching the house from outside and do not
      # resolve in here.
      url: http://homeassistant:8123/lovelace/0
      icon: home-assistant
      # A long-lived access token, from your Home Assistant profile page. This
      # is THE one to fill in: a token belongs to an address, and a link is the
      # only thing here that names one, so this is the token every panel uses
      # to open the dashboard already logged in.
      #
      # A panel also offers a token: of its own, under advanced:, and it is not
      # a second copy of this one -- it is an override, for the rare panel that
      # opens a DIFFERENT Home Assistant from the rest of the house. Leave it
      # empty unless that is what you mean.
      token: ""
  # The page of links this add-on builds, for a panel whose url is
  # "launcher". Appearance only -- what the tiles open is links: above.
  launcher:
    # The page a panel comes home to, built by this add-on from the list below.
    # Put "launcher" in a panel's url and it starts here; hold the top-left
    # corner for a second from anywhere and it comes back here.
    #
    # icon is a name from the list in the documentation, or one character you
    # type yourself. Nothing is fetched from the internet, so an icon pack that
    # failed to load could never leave holes where the labels should be.
    #
    # quality is optional and per link, which is the point of having it here: a
    # film wants far fewer bytes than a dashboard and does not show the
    # difference. Measured on full motion at 800x1280, quality 60 costs
    # 1123 KiB/s and quality 40 costs 930. It applies while that page is open
    # and goes back to the panel's own quality everywhere else.
    # dark or light.
    theme: dark
    # How many links across. 0 lets the panel decide, which is what a launcher
    # shown on three shapes of screen wants.
    columns: 0
    # Where the bar sits: left, center or right.
    align: left
    clock:
      # The time and the date, above the links. Formatted by the browser, so they
      # follow `locale:` -- a French panel writes "lundi 2 septembre" without this
      # add-on knowing any French.
      #
      # Deliberately without seconds: a digit that changes every second is a
      # rectangle sent to the panel every second for as long as it is awake. On
      # the minute it is one small rectangle a minute, and a sleeping panel sends
      # nothing at all.
      show: true
      # The bar above the links: how big each part of it is, what colour the clock
      # and the date are, and where the whole bar sits.
      #
      # The sizes are small, medium, large or huge -- named rather than a number of
      # pixels because "large" is a decision and "72px" is an experiment, and each
      # is still a range so it adapts between a 1024x600 panel and a 800x1280 one.
      size: medium
      # A Tailwind palette name, the same list as launcher_color. "theme" leaves
      # it the text colour of whichever theme is on.
      color: theme
    date:
      size: medium
      color: theme
    weather:
      # A Home Assistant weather entity -- weather.forecast_home, weather.chez_moi
      # -- shown beside the clock. Empty for none.
      #
      # The reading is fetched by THIS ADD-ON, through the credential the
      # Supervisor gives it, and served to the page from 127.0.0.1. It needs no
      # token: and no url: from you, and it does not care where you put the
      # dashboard's token -- the page itself never reaches Home Assistant.
      entity: ""
      # The weather has no colour of its own: it is an emoji, which a browser
      # draws in its own colours whatever this said.
      size: medium
    background:
      # A wallpaper is any of four things:
      #   nothing         -- the plain colour
      #   an address      -- Home Assistant serves /config/www at /local, so
      #                      http://homeassistant:8123/local/wall.jpg is the easy
      #                      one
      #   a file          -- under /config, /share or /media, served from here
      #   a FOLDER        -- under the same three: a digital photograph frame.
      #                      The first picture is shown; turn launcher_slideshow
      #                      on to cycle through them.
      # Anything else leaves the plain colour, and the log says which it was.
      source: ""
      # Let a GIF or an MP4 wallpaper actually move.
      #
      # Off by default, and not out of caution: a picture that changes is a WHOLE
      # PANEL on the wire, so a video wallpaper is the panel's entire bandwidth
      # for as long as it is awake -- against a still page, which sends nothing at
      # all. Off, a video shows its first frame and a GIF is frozen on its own, so
      # the picture is still there and costs nothing.
      motion: false
      # off, sm, md or xl. A blurred photograph is a background; a sharp one
      # competes with the links in front of it.
      blur: md
      # How far to darken it, 0 to 100. Nearly every photograph is too bright to
      # read white text over, and this is what makes one usable.
      dim: 40
    # enabled rather than on: in YAML 1.1 an `on` key reads as the
    # boolean true, which would make the key itself disappear.
    slideshow:
      # The digital photograph frame: cycle through the pictures. Off shows the
      # first one and nothing more.
      enabled: false
      # Where those pictures are, when they are NOT on this machine: one address
      # per entry, http:// or https://. A photo server, a NAS, anything serving a
      # folder over HTTP -- the panel's own browser fetches them, so whatever
      # serves them has to be reachable from here.
      #
      # Leave it empty to use the FOLDER given as launcher_background instead,
      # which is the route for pictures you upload: Home Assistant's Media panel
      # (Media > My media > Upload) writes into /media, and this add-on reads it.
      urls: []
      # How long each picture is shown, in seconds.
      seconds: 30
      # How long one picture takes to fade into the next, in seconds. THIS is the
      # expensive setting, not the slideshow: a fade is one whole panel per frame
      # for as long as it lasts, so at 25 fps two seconds is about fifty of them.
      # 0 is a hard cut and costs exactly one.
      fade: 1
      # How often the folder is looked at again, in minutes, so a photograph
      # dropped in appears without restarting the add-on.
      rescan: 60
  # A launcher of a panel's OWN: its links, its columns, its clock, its
  # wallpaper, everything -- independent of every other panel. One entry per
  # panel, named by the panel's name. A panel with no entry here shows the
  # house's links: and launcher: above. Every setting but panel and links is
  # optional and, left out, is the house launcher's.
  #
  #   - panel: cuisine
  #     columns: 3
  #     clock_size: medium
  #     background: http://192.168.1.3:8080/cuisine.jpg
  #     links:
  #       - name: Recettes
  #         url: https://www.marmiton.org
  #         icon: cuisine
  launchers: []
  # What every panel inherits unless its own advanced: says otherwise.
  defaults:
    # Set once here and every panel inherits it. A panel may still override any
    # of these for itself.
    #
    # Home Assistant's own address and token are NOT here any more: they are a
    # link, under links: below, with a token: of its own. That is where they
    # belong -- a token belongs to an address, and this list already had one per
    # link. See "Moving from 2.x" in the documentation.
    port: 5000
    # The upper bound on how often a change is acted on, and the one setting that
    # decides whether video looks like video.
    #
    # It was 10, on the reasoning that a touch lifts it to thirty for two seconds
    # anyway. That is true and it is beside the point for anything you WATCH:
    # nobody touches the panel while a film plays, so the window closes and the
    # picture falls back to this number. Measured on a page moving continuously
    # with no finger on it: 9.5 pictures a second at 10, 17.8 at 20, 25.3 at 30.
    #
    # A still dashboard costs nothing whatever this is set to -- what is not
    # changing is not sent. It only bites when something moves, so the cost is
    # a camera tile or a video, which is exactly where the smoothness is wanted.
    # Lower it to 10 or 4 if the machine running this has other work to do, or if
    # a panel of yours only ever shows a dashboard.
    fps: 25
    quality: 80
    # The on-screen keyboard, drawn by the browser whenever a text field takes
    # focus -- the dashboard's search, Assist, the search box of an ordinary
    # site. A panel has no keys, so without it those are dead ends. It takes no
    # room when nothing is waiting for text. Set it to the layout you want the
    # letters in, or off to leave it out.
    keyboard: qwerty
    # Keep the browser's profile between restarts, one directory per panel under
    # the add-on's own storage. Without it every restart is a first visit: a site
    # signed into is signed out again, and a consent banner comes back. With it,
    # sign in once from the panel's keyboard and it stays signed in.
    keep_profile: true
    # The language the pages are asked for, as a BCP 47 tag -- fr-FR, de-DE,
    # en-GB. It is not cosmetic: left to itself the browser sends no
    # Accept-Language header AT ALL, so every site serves its own default
    # language whatever the household speaks, and it reports a language tag no
    # real browser produces.
    locale: en-US
    # A remote for every panel, in the iPhone's own Control Centre -- the
    # widget built for an Apple TV drives any HomeKit accessory of the
    # Television kind, and this makes each panel one. Turn it on, open the
    # add-on's log, and scan the code that appears with the Home app. After
    # that the panel is in the remote list beside any Apple TV, the pad
    # moves between the launcher's tiles, and the TV button brings it home.
    #
    # Nothing is paired to the panel itself and no Bluetooth is involved: the
    # press arrives here, where the page is rendered. Unpair from the Home
    # app like any other accessory.
    homekit: false
  # All off. Turn one on only while something is already wrong: each
  # writes to the add-on's log and nothing else.
  debug:
    # OFF, and it shipped as `true` under that "all off" comment for a long
    # time -- the line directly above it said what the intention was and
    # nobody re-asked the value. It prints one line every five seconds, per
    # panel, for ever: 17 280 lines a day for one panel and twice that for
    # two, which buries every line worth reading and is why the log feels
    # impossible to manage. Home Assistant offers no way to clear an add-on's
    # log, so a log nobody wanted is one nobody can get rid of.
    #
    # It stays a good diagnostic and it is one line to turn on: pictures a
    # second, bytes, how long the panel made the sender wait, and the worst
    # gap. Turn it on while something is wrong and off again afterwards.
    #
    # CHANGING THIS DEFAULT DOES NOT REACH AN EXISTING INSTALL. The Supervisor
    # writes these defaults once, when the add-on is installed, and a stored
    # value is the household's from then on -- so anybody who has been running
    # it has `stats: true` saved and has to turn it off themselves.
    stats: false
    # A diagnostic, off by default: while a video plays it prints the playhead
    # and how many seconds are buffered IN FRONT of it, every two seconds. The
    # ordinary media lines only appear when something has already gone wrong,
    # which is exactly the wrong moment -- "the video stopped" is always a
    # question about the seconds BEFORE it stopped, when the log is silent.
    # Turn it on, reproduce the stall once, and the log says which of the three
    # it was: a buffer that never filled (the fetch), a playhead that stopped
    # while the buffer stayed full (the site), or frames the browser itself
    # threw away (the machine).
    show_media: false
    # Every contact, and what the corner gesture made of it. For diagnosing a
    # panel that does not react the way you expect it to -- noisy, so off.
    show_touches: false
schema:
  panels:
    - name: str
      host: str
      url: str
      width: int(16,4096)
      height: int(16,4096)
      rotate: list(0|90|180|270)
      touch:
        rotate: list(0|90|180|270)
        mirror_x: bool?
        mirror_y: bool?
      advanced:
        port: port?
        token: password?
        home_assistant: bool?
        fps: float?
        quality: int(1,95)?
        keyboard: list(off|qwerty|azerty)?
        blank_after: float?
        keep_profile: bool?
        locale: str?
        user_agent: str?
        import_profile: str?
        stats: bool?
        show_media: bool?
        show_touches: bool?
  links:
    - name: str
      url: str
      icon: str?
      group: str?
      description: str?
      token: password?
      quality: int(1,95)?
      fps: float?
      user_agent: str?
  launcher:
    theme: list(dark|light)?
    columns: int(0,6)?
    align: list(left|center|right)?
    clock:
      show: bool?
      size: list(small|medium|large|huge)?
      color: list(theme|slate|gray|zinc|neutral|stone|red|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|white|black)?
    date:
      size: list(small|medium|large|huge)?
      color: list(theme|slate|gray|zinc|neutral|stone|red|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|white|black)?
    weather:
      entity: str?
      size: list(small|medium|large|huge)?
    background:
      source: str?
      motion: bool?
      blur: list(off|sm|md|xl)?
      dim: int(0,100)?
    slideshow:
      enabled: bool?
      urls:
        - str?
      seconds: int(5,3600)?
      fade: int(0,10)?
      rescan: int(1,1440)?
  launchers:
    - panel: str
      links:
        - name: str
          url: str
          icon: str?
          group: str?
          description: str?
          token: password?
          quality: int(1,95)?
          fps: float?
          user_agent: str?
      theme: list(dark|light)?
      columns: int(0,6)?
      align: list(left|center|right)?
      clock: bool?
      clock_size: list(small|medium|large|huge)?
      clock_color: list(theme|slate|gray|zinc|neutral|stone|red|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|white|black)?
      date_size: list(small|medium|large|huge)?
      date_color: list(theme|slate|gray|zinc|neutral|stone|red|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|white|black)?
      weather: str?
      weather_size: list(small|medium|large|huge)?
      background: str?
      background_motion: bool?
      background_blur: list(off|sm|md|xl)?
      background_dim: int(0,100)?
      slideshow: bool?
      slideshow_urls:
        - str?
      slideshow_seconds: int(5,3600)?
      slideshow_fade: int(0,10)?
      slideshow_rescan: int(1,1440)?
  defaults:
    port: port?
    fps: float?
    quality: int(1,95)?
    keyboard: list(off|qwerty|azerty)?
    keep_profile: bool?
    locale: str?
    homekit: bool?
  debug:
    stats: bool?
    show_media: bool?
    show_touches: bool?

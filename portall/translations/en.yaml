# The names and explanations the add-on's settings page shows, read by
# Home Assistant's Supervisor. Generated by tools/maketranslations.py --
# edit that, not this, so the two languages cannot drift apart.
configuration:
  panels:
    name: 🖥️ 1 · My screens
    description: 'One entry per ESP32-P4 screen: name, IP address, size, and what it shows.'
    fields:
      name:
        name: Screen name
        description: 'A simple name: living, kitchen… Also used in "A screen''s own link page".'
      host:
        name: Screen IP address
        description: For example 192.168.1.11. It is in the screen's ESPHome log.
      url:
        name: What it shows
        description: Write launcher for the page of links, or the address of a page.
      width:
        name: Width (pixels)
        description: The screen's width, e.g. 1024 or 800.
      height:
        name: Height (pixels)
        description: The screen's height, e.g. 600 or 1280.
      rotate:
        name: Picture rotation
        description: 0, 90, 180 or 270 degrees, so the picture is the right way up.
      touch:
        name: 👆 Touch
        description: Given by the calibration (see the documentation). If the picture is rotated, rotate
          the touch too.
        fields:
          rotate:
            name: Touch rotation
          mirror_x:
            name: Mirror left/right
          mirror_y:
            name: Mirror up/down
      advanced:
        name: 🛠️ Advanced
        description: 'Nothing required here: every empty setting takes "Common settings".'
        fields:
          port:
            name: Network port
            description: 5000 unless the screen says otherwise.
          token:
            name: 🔑 Token for this screen only
            description: 'Leave empty: the token goes on the Home Assistant link.'
          home_assistant:
            name: Shows Home Assistant
            description: Off = this screen gets no token (an ordinary site, a train board…).
          fps:
            name: 🎬 Pictures per second
          quality:
            name: ✨ Picture quality
            description: 1 to 95.
          max_rate:
            name: 📶 Maximum rate (KiB/s)
            description: 0 = no limit.
          keyboard:
            name: ⌨️ On-screen keyboard
            description: azerty, qwerty, or off for none.
          blank_after:
            name: Release the page after (seconds)
            description: Once the screen has slept this long, the server stops the page. 300 by default.
          keep_profile:
            name: 💾 Stay signed in to sites
            description: Keeps cookies and sign-ins across restarts.
          locale:
            name: Language
            description: For example en-GB or fr-FR.
          user_agent:
            name: Present itself as…
            description: Rarely needed.
          import_profile:
            name: Import a browser profile
            description: See the documentation.
          stereo:
            name: 🔊 Stereo sound
            description: 'Twice the data. Needs the board updated, and num_channels: 2 on the Bluetooth
              speaker.'
          stats:
            name: 🐞 Statistics
          show_media:
            name: 🐞 Follow videos
          show_touches:
            name: 🐞 Show every touch
  links:
    name: 🔗 2 · Shared links
    description: The tiles of the page of links, for every screen without its own (see 4).
    fields:
      name:
        name: Button name
        description: The text written on the tile.
      url:
        name: Address
        description: 'The page the tile opens. For Home Assistant: http://homeassistant:8123/lovelace/0'
      icon:
        name: Icon
        description: A name (jellyfin, youtube, kitchen, home-assistant…) or an emoji. The list is in
          the documentation.
      group:
        name: Group
        description: Tiles in the same group are shown together, under this heading.
      description:
        name: Small text
        description: One line under the name, for example "Films and series".
      token:
        name: 🔑 Home Assistant token
        description: 'Only for the Home Assistant link: a long-lived token (your profile > Security).
          It opens the dashboard already logged in.'
      quality:
        name: ✨ Picture quality
        description: For this page only, 1 to 95. A film is fine at 40; empty = the screen's own quality.
      fps:
        name: 🎬 Pictures per second
        description: For this page only. Lower = steadier on video; empty = the screen's own.
      max_rate:
        name: 📶 Maximum rate (KiB/s)
        description: For this page only. A busy scene is sent a little softer to stay under it; 0 = no
          limit, empty = the screen's own.
      user_agent:
        name: Present itself as…
        description: Rarely needed. For YouTube's television mode, see the documentation.
  launcher:
    name: 🎨 3 · Look of the page of links
    description: Colours, clock, weather, wallpaper. Applies to every screen; a screen can change any
      of it in 4.
    fields:
      theme:
        name: Theme
        description: Dark or light.
      columns:
        name: Tiles per row
        description: 0 = automatic. 4 for a large 1280x800 screen, 3 for a 7-inch 1024x600.
      align:
        name: Clock position
        description: Left, centre or right.
      tiles:
        name: Shape of the links
        description: 'cards: wide cards, the icon beside the name. buttons: small buttons, the icon on
          top and the name underneath.'
      focus_color:
        name: 🎯 Selection colour
        description: The ring around the link chosen with a remote or a gamepad. On a light background,
          pick black or yellow.
      clock:
        name: 🕒 Clock
        fields:
          show:
            name: Show the clock
          size:
            name: Size
          color:
            name: Colour
            description: theme = the theme's own colour.
      date:
        name: 📅 Date
        fields:
          size:
            name: Size
          color:
            name: Colour
      weather:
        name: ⛅ Weather
        fields:
          entity:
            name: Weather entity
            description: For example weather.forecast_home. Empty = no weather.
          size:
            name: Size
      background:
        name: 🖼️ Wallpaper
        fields:
          source:
            name: Picture
            description: An address (http://…) or a file / folder in /media.
          motion:
            name: Animate (GIF, video)
            description: Costs pictures on the network.
          blur:
            name: Blur
          dim:
            name: Darken (0 to 100)
      slideshow:
        name: 🎞️ Slideshow
        fields:
          enabled:
            name: Cycle the pictures
          urls:
            name: Picture addresses
            description: One per line.
          seconds:
            name: Seconds per picture
          fade:
            name: Fade (seconds)
            description: 0 = hard cut, lighter on the screen.
          rescan:
            name: Re-read the folder (minutes)
  launchers:
    name: 🧩 4 · A screen's own page of links
    description: To give a screen ITS own buttons and look, independent of the others. Add one entry per
      screen.
    fields:
      panel:
        name: For the screen
        description: The screen's name, exactly as in 1 (living, kitchen…).
      links:
        name: 🔗 Its links
        description: This screen's tiles only.
        fields:
          name:
            name: Button name
            description: The text written on the tile.
          url:
            name: Address
            description: 'The page the tile opens. For Home Assistant: http://homeassistant:8123/lovelace/0'
          icon:
            name: Icon
            description: A name (jellyfin, youtube, kitchen, home-assistant…) or an emoji. The list is
              in the documentation.
          group:
            name: Group
            description: Tiles in the same group are shown together, under this heading.
          description:
            name: Small text
            description: One line under the name, for example "Films and series".
          token:
            name: 🔑 Home Assistant token
            description: 'Only for the Home Assistant link: a long-lived token (your profile > Security).
              It opens the dashboard already logged in.'
          quality:
            name: ✨ Picture quality
            description: For this page only, 1 to 95. A film is fine at 40; empty = the screen's own quality.
          fps:
            name: 🎬 Pictures per second
            description: For this page only. Lower = steadier on video; empty = the screen's own.
          max_rate:
            name: 📶 Maximum rate (KiB/s)
            description: For this page only. A busy scene is sent a little softer to stay under it; 0
              = no limit, empty = the screen's own.
          user_agent:
            name: Present itself as…
            description: Rarely needed. For YouTube's television mode, see the documentation.
      theme:
        name: Theme
        description: Dark or light.
      columns:
        name: Tiles per row
        description: 0 = automatic. 4 for a large 1280x800 screen, 3 for a 7-inch 1024x600.
      align:
        name: Clock position
        description: Left, centre or right.
      tiles:
        name: Shape of the links
        description: 'cards: wide cards, the icon beside the name. buttons: small buttons, the icon on
          top and the name underneath.'
      focus_color:
        name: 🎯 Selection colour
        description: The ring around the link chosen with a remote or a gamepad. On a light background,
          pick black or yellow.
      clock:
        name: 🕒 Show the clock
      clock_size:
        name: 🕒 Clock size
      clock_color:
        name: 🕒 Clock colour
      date_size:
        name: 📅 Date size
      date_color:
        name: 📅 Date colour
      weather:
        name: ⛅ Weather entity
        description: For example weather.forecast_home.
      weather_size:
        name: ⛅ Weather size
      background:
        name: 🖼️ Wallpaper
        description: An address (http://…) or a file / folder in /media.
      background_motion:
        name: 🖼️ Animate the wallpaper
      background_blur:
        name: 🖼️ Wallpaper blur
      background_dim:
        name: 🖼️ Darken the wallpaper (0 to 100)
      slideshow:
        name: 🎞️ Slideshow
      slideshow_urls:
        name: 🎞️ Picture addresses
      slideshow_seconds:
        name: 🎞️ Seconds per picture
      slideshow_fade:
        name: 🎞️ Fade (seconds)
      slideshow_rescan:
        name: 🎞️ Re-read the folder (minutes)
  defaults:
    name: ⚙️ 5 · Common settings
    description: Apply to every screen, except what a screen changes in its "Advanced".
    fields:
      port:
        name: Network port
        description: 5000, as in the screen's YAML.
      fps:
        name: 🎬 Pictures per second
        description: 25 suits nearly everything.
      quality:
        name: ✨ Picture quality
        description: 1 to 95. Lower = smoother, less sharp.
      max_rate:
        name: 📶 Maximum rate (KiB/s)
        description: What a screen's Wi-Fi takes without stalling. A busy video is sent a little softer
          to stay under it. 2400 suits the ESP32-C6; 0 = no limit.
      keyboard:
        name: ⌨️ On-screen keyboard
      keep_profile:
        name: 💾 Stay signed in to sites
      locale:
        name: Language of the pages
        description: en for English.
      homekit:
        name: 📱 iPhone remote (HomeKit)
        description: Each screen appears in the Home app and in Control Centre's remote.
  debug:
    name: 🐞 6 · Diagnostics
    description: 'Leave off. Only turn on to track down a problem: it fills the log.'
    fields:
      stats:
        name: Statistics every 5 seconds
      show_media:
        name: Follow videos
      show_touches:
        name: Show every touch

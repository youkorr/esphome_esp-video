# The names and explanations the add-on's settings page shows, read by
# Home Assistant's Supervisor. Generated by tools/maketranslations.py --
# edit that, not this, so the two languages cannot drift apart.
configuration:
  defaults:
    name: ⚙️ 1 · Common settings
    description: 'Apply to every screen: language, keyboard, smoothness, quality, the port. The values
      offered suit nearly everything.'
    fields:
      port:
        name: Network port
        description: 5000, as in the screen's YAML.
      fps:
        name: 🎬 Pictures per second
        description: 25 suits nearly everything.
      quality:
        name: ✨ Picture quality
        description: 1 to 95. Lower = smoother, less sharp.
      max_rate:
        name: 📶 Maximum rate (KiB/s)
        description: What a screen's Wi-Fi takes without stalling. A busy video is sent a little softer
          to stay under it. 3000 by default; lower it towards 2400 if a video freezes now and then. 0
          = no limit.
      keyboard:
        name: ⌨️ On-screen keyboard
      keep_profile:
        name: 💾 Stay signed in to sites
      locale:
        name: Language of the pages
        description: en for English.
      homekit:
        name: 📱 iPhone remote (HomeKit)
        description: Each screen appears in the Home app and in Control Centre's remote.
  panels:
    name: 🖥️ 2 · My screens
    description: 'One entry per ESP32-P4 screen: name, IP address, size, and what it shows.'
    fields:
      name:
        name: Screen name
        description: 'A simple name: living, kitchen… Also used in "A screen''s own link page".'
      enabled:
        name: ✅ Screen in use
        description: 'Untick for maintenance or an unplugged screen: the add-on stops looking for it and
          keeps its settings.'
      host:
        name: Screen IP address
        description: For example 192.168.1.11. It is in the screen's ESPHome log.
      url:
        name: What it shows
        description: Write launcher for the page of links, or the address of a page.
      width:
        name: Width (pixels)
        description: The screen's width, e.g. 1024 or 800.
      height:
        name: Height (pixels)
        description: The screen's height, e.g. 600 or 1280.
      rotate:
        name: Picture rotation
        description: 0, 90, 180 or 270 degrees, so the picture is the right way up.
      touch:
        name: 👆 Touch
        description: Given by the calibration (see the documentation). If the picture is rotated, rotate
          the touch too.
        fields:
          rotate:
            name: Touch rotation
          mirror_x:
            name: Mirror left/right
          mirror_y:
            name: Mirror up/down
      advanced:
        name: 🛠️ Advanced
        description: Nothing required here. Port, pictures per second, quality, rate, keyboard, staying
          signed in and language are set once for every screen in 1 · Common settings; diagnostics in
          6.
        fields:
          token:
            name: 🔑 Token for this screen only
            description: 'Leave empty: the token goes on the Home Assistant link.'
          home_assistant:
            name: Shows Home Assistant
            description: Off = this screen gets no token (an ordinary site, a train board…).
          esphome_device:
            name: 📶 The screen's ESPHome name (Wi-Fi, Bluetooth)
            description: 'Only if the log says no device has the screen''s address: the name in its YAML
              (esphome: name:). Otherwise the screen is found by itself.'
          blank_after:
            name: Release the page after (seconds)
            description: Once the screen has slept this long, the server stops the page. 300 by default.
          user_agent:
            name: Present itself as…
            description: Rarely needed.
          import_profile:
            name: Import a browser profile
            description: See the documentation.
          glide:
            name: 📱 Scroll like a tablet
            description: A page flicked with a finger carries on and slows down. A finger laid on it stops
              it. On trial.
          stereo:
            name: 🔊 Stereo sound
            description: 'Twice the data. Needs the board updated, and num_channels: 2 on the Bluetooth
              speaker.'
          sharp:
            name: ✨ Sharp picture when still
            description: 'On when empty. Half a second after the last change, the screen is sent a lossless
              picture in full colour: icons, text and photos sharp. Turn off only if the screen does not
              show it.'
  links:
    name: 🔗 3 · Shared links
    description: The tiles of the page of links, for every screen without its own (see 5).
    fields:
      name:
        name: Button name
        description: The text written on the tile.
      url:
        name: Address
        description: 'The page the tile opens. For Home Assistant: http://homeassistant:8123/lovelace/0'
      icon:
        name: Icon
        description: A name (jellyfin, youtube, kitchen, home-assistant…) or an emoji. The list is in
          the documentation.
      group:
        name: Group
        description: Tiles in the same group are shown together, under this heading.
      description:
        name: Small text
        description: One line under the name, for example "Films and series".
      token:
        name: 🔑 Home Assistant token
        description: 'Only for the Home Assistant link: a long-lived token (your profile > Security).
          It opens the dashboard already logged in.'
      quality:
        name: ✨ Picture quality
        description: For this page only, 1 to 95. A film is fine at 40; empty = the screen's own quality.
      fps:
        name: 🎬 Pictures per second
        description: For this page only. Lower = steadier on video; empty = the screen's own.
      max_rate:
        name: 📶 Maximum rate (KiB/s)
        description: For this page only. A busy scene is sent a little softer to stay under it; 0 = no
          limit, empty = the screen's own.
      user_agent:
        name: Present itself as…
        description: Rarely needed. For YouTube's television mode, see the documentation.
      voice:
        name: 🗣️ Other names to say
        description: 'To open it by voice: what the voice assistant writes when you say the name, separated
          by commas. For example "jelly fin, jellyfish" for Jellyfin.'
  launcher:
    name: 🎨 4 · Look of the page of links
    description: Colours, clock, weather, wallpaper. Applies to every screen; a screen can change any
      of it in 5.
    fields:
      theme:
        name: Theme
        description: Dark or light.
      columns:
        name: Tiles per row
        description: 0 = automatic. 4 for a large 1280x800 screen, 3 for a 7-inch 1024x600.
      align:
        name: Clock position
        description: Left, centre or right.
      tiles:
        name: Shape of the links
        description: 'cards: wide cards, the icon beside the name. buttons: small buttons, the icon on
          top and the name underneath.'
      focus_color:
        name: 🎯 Selection colour
        description: The ring around the link chosen with a remote or a gamepad. On a light background,
          pick black or yellow.
      tile_background:
        name: 🪟 The links' ground
        description: 'solid: the usual ground. transparent: only the icon, in its own colours, and the
          name -- the wallpaper shows behind.'
      tile_size:
        name: 🔍 Size of the links
        description: 'medium: the usual size. small: smaller. tiny: much smaller. The buttons and their
          text shrink together.'
      tile_text_color:
        name: ✏️ Colour of the links' text
        description: theme = the theme's own colour. On a light wallpaper, pick black for example.
      avatar:
        name: 😊 Avatar
        description: A small robot with a screen for a face and headphones on, the size of a button, in
          the bottom right corner. Its eyes change shape for each expression. Drag it with a finger to
          put it anywhere; it stays there.
      avatar_voice:
        name: 🎙️ The avatar's voice assistant
        description: 'The face listens, thinks and answers with it. Empty: Home Assistant''s only voice
          assistant. With several, put this screen''s (assist_satellite.guition, say). off: none.'
      voice_links:
        name: 🗣️ Open links by voice
        description: 'Say "open Jellyfin" or "go home" to the screen''s voice assistant. The add-on writes
          the automation "Portall : ouvrir un lien à la voix" into Home Assistant for it and keeps it
          in step with your links.'
      clock:
        name: 🕒 Clock
        fields:
          show:
            name: Show the clock
          size:
            name: Size
          color:
            name: Colour
            description: theme = the theme's own colour.
      date:
        name: 📅 Date
        fields:
          size:
            name: Size
          color:
            name: Colour
      weather:
        name: ⛅ Weather
        fields:
          entity:
            name: Weather entity
            description: For example weather.forecast_home. Empty = no weather.
          size:
            name: Size
          color:
            name: Temperature colour
            description: theme = the theme's own colour. The sky is an emoji and keeps its colours.
      background:
        name: 🖼️ Wallpaper
        fields:
          source:
            name: Picture
            description: An address (http://…) or a file / folder in /media.
          motion:
            name: Animate (GIF, video)
            description: Costs pictures on the network.
          blur:
            name: Blur
          dim:
            name: Darken (0 to 100)
      slideshow:
        name: 🎞️ Slideshow and screen saver
        description: After a few minutes without a touch, the pictures full screen with no links, over
          whatever the screen shows. A touch takes it back to where it was.
        fields:
          enabled:
            name: On (the wallpaper's pictures)
          urls:
            name: Picture addresses
            description: One per line.
          seconds:
            name: Seconds per picture
          fade:
            name: Fade (seconds)
            description: 0 = hard cut, lighter on the screen.
          rescan:
            name: Re-read the folder (minutes)
          after:
            name: ⏱️ Screen saver after (minutes)
            description: Without a touch. Set the screen's own backlight timeout (its YAML) longer. 0
              = the pictures change behind the links, no screen saver.
          clock:
            name: 🕒 Time on the screen saver
          date:
            name: 📅 Date on the screen saver
          weather:
            name: ⛅ Weather on the screen saver
          avatar:
            name: 😊 Avatar on the screen saver
            description: If it is on for the page of links.
          clock_position:
            name: '🕒 Time: place on the screen saver'
            description: 'top_left, top, top_right, left, center, right, bottom_left, bottom or bottom_right.
              Two in the same place stack: time, date, weather, avatar.'
          clock_size:
            name: '🕒 Time: size on the screen saver'
          clock_color:
            name: '🕒 Time: colour on the screen saver'
            description: white, or theme = the theme's own colour.
          date_position:
            name: '📅 Date: place on the screen saver'
            description: 'top_left, top, top_right, left, center, right, bottom_left, bottom or bottom_right.
              Two in the same place stack: time, date, weather, avatar.'
          date_size:
            name: '📅 Date: size on the screen saver'
          date_color:
            name: '📅 Date: colour on the screen saver'
            description: white, or theme = the theme's own colour.
          weather_position:
            name: '⛅ Weather: place on the screen saver'
            description: 'top_left, top, top_right, left, center, right, bottom_left, bottom or bottom_right.
              Two in the same place stack: time, date, weather, avatar.'
          weather_size:
            name: '⛅ Weather: size on the screen saver'
          weather_color:
            name: '⛅ Weather: colour on the screen saver'
            description: The temperature; the sky is an emoji and keeps its colours.
          avatar_position:
            name: '😊 Avatar: place on the screen saver'
            description: 'top_left, top, top_right, left, center, right, bottom_left, bottom or bottom_right.
              Two in the same place stack: time, date, weather, avatar.'
          avatar_size:
            name: '😊 Avatar: size on the screen saver'
          shade:
            name: 🌗 Veil on the screen saver
            description: 'Darkens only the corners something sits in: none, light or strong.'
  launchers:
    name: 🧩 5 · A screen's own page of links
    description: To give a screen ITS own buttons and look, independent of the others. Add one entry per

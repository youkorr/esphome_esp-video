# The names and explanations the add-on's settings page shows, read by
# Home Assistant's Supervisor. Generated by tools/maketranslations.py --
# edit that, not this, so the two languages cannot drift apart.
configuration:
  panels:
    name: 🖥️ 1 · Mes écrans
    description: Un élément par écran ESP32-P4. Nom, adresse IP, taille, et ce qu'il affiche.
    fields:
      name:
        name: Nom de l'écran
        description: 'Un nom simple : salon, cuisine… Sert aussi dans « Page de liens propre à un écran
          ».'
      host:
        name: Adresse IP de l'écran
        description: Par exemple 192.168.1.11. Elle est dans le journal de l'écran (ESPHome).
      url:
        name: Ce qu'il affiche
        description: Écrivez launcher pour la page de liens, ou l'adresse d'une page.
      width:
        name: Largeur (pixels)
        description: La largeur de l'écran, par exemple 1024 ou 800.
      height:
        name: Hauteur (pixels)
        description: La hauteur de l'écran, par exemple 600 ou 1280.
      rotate:
        name: Rotation de l'image
        description: 0, 90, 180 ou 270 degrés, pour que l'image soit à l'endroit.
      touch:
        name: 👆 Toucher
        description: Donné par la calibration (voir la documentation). Si l'image est tournée, tournez
          aussi le toucher.
        fields:
          rotate:
            name: Rotation du toucher
          mirror_x:
            name: Inverser gauche/droite
          mirror_y:
            name: Inverser haut/bas
      advanced:
        name: 🛠️ Avancé
        description: 'Rien d''obligatoire ici : chaque réglage vide reprend « Réglages communs ».'
        fields:
          port:
            name: Port réseau
            description: 5000 sauf si l'écran dit autre chose.
          token:
            name: 🔑 Jeton pour cet écran seulement
            description: 'Laissez vide : le jeton se met sur le lien Home Assistant.'
          home_assistant:
            name: Montre Home Assistant
            description: Éteint = cet écran ne reçoit aucun jeton (un site ordinaire, un horaire de train…).
          fps:
            name: 🎬 Images par seconde
          quality:
            name: ✨ Qualité de l'image
            description: 1 à 95.
          max_rate:
            name: 📶 Débit maximum (Ko/s)
            description: 0 = sans limite.
          keyboard:
            name: ⌨️ Clavier à l'écran
            description: azerty, qwerty, ou off pour aucun.
          blank_after:
            name: Libérer la page après (secondes)
            description: Quand l'écran dort depuis ce temps, le serveur arrête la page. 300 par défaut.
          keep_profile:
            name: 💾 Rester connecté aux sites
            description: Garde cookies et connexions entre deux redémarrages.
          locale:
            name: Langue
            description: Par exemple fr ou fr-FR.
          user_agent:
            name: Se présenter comme…
            description: Rarement utile.
          import_profile:
            name: Importer un profil de navigateur
            description: Voir la documentation.
          stereo:
            name: 🔊 Son en stéréo
            description: 'Le double de données. Carte à jour obligatoire, et num_channels: 2 sur l''enceinte
              Bluetooth.'
          stats:
            name: 🐞 Statistiques
          show_media:
            name: 🐞 Suivre les vidéos
          show_touches:
            name: 🐞 Afficher chaque toucher
  links:
    name: 🔗 2 · Liens communs
    description: Les tuiles de la page de liens, pour tous les écrans qui n'ont pas la leur (voir 4).
    fields:
      name:
        name: Nom du bouton
        description: Le texte écrit sur la tuile.
      url:
        name: Adresse
        description: 'La page qui s''ouvre quand on touche la tuile. Pour Home Assistant : http://homeassistant:8123/lovelace/0'
      icon:
        name: Icône
        description: Un nom (jellyfin, youtube, cuisine, home-assistant…) ou un emoji. La liste est dans
          la documentation.
      group:
        name: Groupe
        description: Les tuiles d'un même groupe sont rangées ensemble, sous ce titre.
      description:
        name: Petit texte
        description: Une ligne sous le nom, par exemple « Films et séries ».
      token:
        name: 🔑 Jeton Home Assistant
        description: 'Seulement pour le lien Home Assistant : un jeton longue durée (votre profil > Sécurité).
          Il ouvre le tableau de bord déjà connecté.'
      quality:
        name: ✨ Qualité de l'image
        description: Pour cette page seulement, de 1 à 95. Un film se contente de 40 ; vide = la qualité
          de l'écran.
      fps:
        name: 🎬 Images par seconde
        description: Pour cette page seulement. Plus bas = plus régulier sur une vidéo ; vide = celui
          de l'écran.
      max_rate:
        name: 📶 Débit maximum (Ko/s)
        description: Pour cette page seulement. Une scène chargée est envoyée un peu moins nette pour
          rester dessous ; 0 = sans limite, vide = celui de l'écran.
      user_agent:
        name: Se présenter comme…
        description: Rarement utile. Pour YouTube en mode télévision, voir la documentation.
  launcher:
    name: 🎨 3 · Apparence de la page de liens
    description: Couleurs, horloge, météo, fond d'écran. S'applique à tous les écrans ; un écran peut
      changer ce qu'il veut en 4.
    fields:
      theme:
        name: Thème
        description: Sombre (dark) ou clair (light).
      columns:
        name: Tuiles par ligne
        description: 0 = automatique. 4 pour un grand écran 1280x800, 3 pour un 7 pouces 1024x600.
      align:
        name: Position de l'horloge
        description: À gauche, au centre ou à droite.
      tiles:
        name: Forme des liens
        description: 'cards : grandes cartes, icône à côté du nom. buttons : petits boutons, icône en
          haut et nom en dessous.'
      focus_color:
        name: 🎯 Couleur de la sélection
        description: Le cadre autour du lien choisi à la télécommande ou à la manette. Sur un fond clair,
          prenez black ou yellow.
      avatar:
        name: 😊 Avatar
        description: Un petit visage de la taille d'un bouton, en bas à droite. Glissez-le du doigt pour
          le mettre où vous voulez ; il y reste.
      avatar_voice:
        name: 🎙️ Assistant vocal de l'avatar
        description: 'Le visage écoute, réfléchit et répond avec lui. Vide : le seul assistant vocal de
          Home Assistant. S''il y en a plusieurs, mettez celui de cet écran (assist_satellite.guition
          par exemple). off : aucun.'
      voice_links:
        name: 🗣️ Ouvrir les liens à la voix
        description: 'Dites « ouvre Jellyfin » ou « retour à l''accueil » à l''assistant vocal de l''écran.
          L''add-on écrit pour cela l''automatisation « Portall : ouvrir un lien à la voix » dans Home
          Assistant et la tient à jour avec vos liens.'
      clock:
        name: 🕒 Horloge
        fields:
          show:
            name: Afficher l'horloge
          size:
            name: Taille
          color:
            name: Couleur
            description: theme = la couleur du thème.
      date:
        name: 📅 Date
        fields:
          size:
            name: Taille
          color:
            name: Couleur
      weather:
        name: ⛅ Météo
        fields:
          entity:
            name: Entité météo
            description: Par exemple weather.forecast_maison. Vide = pas de météo.
          size:
            name: Taille
      background:
        name: 🖼️ Fond d'écran
        fields:
          source:
            name: Image
            description: Une adresse (http://…) ou un fichier / dossier dans /media.
          motion:
            name: Animer (GIF, vidéo)
            description: Coûte des images sur le réseau.
          blur:
            name: Flou
          dim:
            name: Assombrir (0 à 100)
      slideshow:
        name: 🎞️ Diaporama
        fields:
          enabled:
            name: Faire défiler les images
          urls:
            name: Adresses des images
            description: Une par ligne.
          seconds:
            name: Secondes par image
          fade:
            name: Fondu (secondes)
            description: 0 = coupure nette, plus léger pour l'écran.
          rescan:
            name: Relire le dossier (minutes)
  launchers:
    name: 🧩 4 · Page de liens propre à un écran
    description: Pour qu'un écran ait SES boutons et SON apparence, indépendants des autres. Ajoutez un
      élément par écran concerné.
    fields:
      panel:
        name: Pour l'écran
        description: Le nom de l'écran, exactement comme en 1 (salon, cuisine…).
      links:
        name: 🔗 Ses liens
        description: Les tuiles de cet écran seulement.
        fields:
          name:
            name: Nom du bouton
            description: Le texte écrit sur la tuile.
          url:
            name: Adresse
            description: 'La page qui s''ouvre quand on touche la tuile. Pour Home Assistant : http://homeassistant:8123/lovelace/0'
          icon:
            name: Icône
            description: Un nom (jellyfin, youtube, cuisine, home-assistant…) ou un emoji. La liste est
              dans la documentation.
          group:
            name: Groupe
            description: Les tuiles d'un même groupe sont rangées ensemble, sous ce titre.
          description:
            name: Petit texte
            description: Une ligne sous le nom, par exemple « Films et séries ».
          token:
            name: 🔑 Jeton Home Assistant
            description: 'Seulement pour le lien Home Assistant : un jeton longue durée (votre profil
              > Sécurité). Il ouvre le tableau de bord déjà connecté.'
          quality:
            name: ✨ Qualité de l'image
            description: Pour cette page seulement, de 1 à 95. Un film se contente de 40 ; vide = la qualité
              de l'écran.
          fps:
            name: 🎬 Images par seconde
            description: Pour cette page seulement. Plus bas = plus régulier sur une vidéo ; vide = celui
              de l'écran.
          max_rate:
            name: 📶 Débit maximum (Ko/s)
            description: Pour cette page seulement. Une scène chargée est envoyée un peu moins nette pour
              rester dessous ; 0 = sans limite, vide = celui de l'écran.
          user_agent:
            name: Se présenter comme…
            description: Rarement utile. Pour YouTube en mode télévision, voir la documentation.
      theme:
        name: Thème
        description: Sombre (dark) ou clair (light).
      columns:
        name: Tuiles par ligne
        description: 0 = automatique. 4 pour un grand écran 1280x800, 3 pour un 7 pouces 1024x600.
      align:
        name: Position de l'horloge
        description: À gauche, au centre ou à droite.
      tiles:
        name: Forme des liens
        description: 'cards : grandes cartes, icône à côté du nom. buttons : petits boutons, icône en
          haut et nom en dessous.'
      focus_color:
        name: 🎯 Couleur de la sélection
        description: Le cadre autour du lien choisi à la télécommande ou à la manette. Sur un fond clair,
          prenez black ou yellow.
      avatar:
        name: 😊 Avatar
        description: Un petit visage de la taille d'un bouton, en bas à droite. Glissez-le du doigt pour
          le mettre où vous voulez ; il y reste.
      avatar_voice:
        name: 🎙️ Assistant vocal de l'avatar
        description: 'Le visage écoute, réfléchit et répond avec lui. Vide : le seul assistant vocal de
          Home Assistant. S''il y en a plusieurs, mettez celui de cet écran (assist_satellite.guition
          par exemple). off : aucun.'
      clock:
        name: 🕒 Afficher l'horloge
      clock_size:
        name: 🕒 Taille de l'horloge
      clock_color:
        name: 🕒 Couleur de l'horloge
      date_size:
        name: 📅 Taille de la date
      date_color:
        name: 📅 Couleur de la date
      weather:
        name: ⛅ Entité météo
        description: Par exemple weather.forecast_maison.
      weather_size:
        name: ⛅ Taille de la météo
      background:
        name: 🖼️ Fond d'écran
        description: Une adresse (http://…) ou un fichier / dossier dans /media.
      background_motion:
        name: 🖼️ Animer le fond
      background_blur:
        name: 🖼️ Flou du fond
      background_dim:
        name: 🖼️ Assombrir le fond (0 à 100)
      slideshow:
        name: 🎞️ Diaporama
      slideshow_urls:
        name: 🎞️ Adresses des images
      slideshow_seconds:
        name: 🎞️ Secondes par image
      slideshow_fade:
        name: 🎞️ Fondu (secondes)
      slideshow_rescan:
        name: 🎞️ Relire le dossier (minutes)
  defaults:
    name: ⚙️ 5 · Réglages communs
    description: Valent pour tous les écrans, sauf ce qu'un écran change dans son « Avancé ».
    fields:
      port:
        name: Port réseau
        description: 5000, comme dans le YAML de l'écran.
      fps:
        name: 🎬 Images par seconde
        description: 25 convient à presque tout.
      quality:
        name: ✨ Qualité de l'image
        description: 1 à 95. Plus bas = plus fluide, moins net.
      max_rate:
        name: 📶 Débit maximum (Ko/s)
        description: Ce que le Wi-Fi d'un écran reçoit sans décrocher. Une vidéo chargée est envoyée un
          peu moins nette pour rester dessous. 2400 convient à l'ESP32-C6 ; 0 = sans limite.
      keyboard:
        name: ⌨️ Clavier à l'écran
      keep_profile:
        name: 💾 Rester connecté aux sites
      locale:
        name: Langue des pages
        description: fr pour le français.
      homekit:
        name: 📱 Télécommande iPhone (HomeKit)
        description: Chaque écran apparaît dans l'app Maison et dans la télécommande du Centre de contrôle.
  debug:
    name: 🐞 6 · Diagnostic
    description: 'À laisser éteint. À allumer seulement pour chercher un problème : cela remplit le journal.'
    fields:
      stats:
        name: Statistiques toutes les 5 secondes
      show_media:
        name: Suivre les vidéos
      show_touches:
        name: Afficher chaque toucher
